<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E Ink 贈品庫存管理</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --accent:#a87c72; --accent-bg:#f3ede9;
  --warn:#b08a6e;   --warn-bg:#f5ede6;
  --ok:#7a9387;     --ok-bg:#edf2f0;
  --danger:#a0574e; --danger-bg:#f5ebe9;
  --ink:#3a3530; --mid:#8c847c; --line:#e8e2dc;
  --bg:#f2ede8; --white:#faf8f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.6;cursor:default}
input,select,textarea{font-family:inherit;font-size:14px}

/* Header */
header{height:56px;background:var(--white);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:10}
header .logo{font-weight:800;font-size:16px;color:var(--accent);white-space:nowrap}
header .search{flex:1;max-width:360px;display:flex;align-items:center;background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:0 10px}
header .search input{flex:1;border:none;background:none;padding:8px 6px;outline:none;color:var(--ink)}
header .hbtn{padding:8px 12px;border-radius:7px;background:var(--accent-bg);color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.hbtn{white-space:nowrap}
@media (max-width:640px){
  header{height:auto;flex-wrap:wrap;gap:8px;padding:8px 12px}
  header .search{order:9;flex:1 1 100%;max-width:none}
  header .hbtn{padding:7px 10px;font-size:12px}
  header .user{margin-left:auto}
}
body.st-open .toast{bottom:92px}
header .hbtn:hover{filter:brightness(.97)}

/* Stats bar */
.stats{display:flex;gap:10px;padding:14px 16px 4px;flex-wrap:wrap}
.stat{background:var(--white);border:1px solid var(--line);border-radius:10px;
  padding:11px 16px;display:flex;align-items:center;gap:10px}
.stat .label{font-size:12px;color:var(--mid)}
.stat .value{font-size:16px;font-weight:700}
.stat.low .value{color:var(--warn)}

/* Cards grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:14px 16px 90px}
.card{background:var(--white);border:1px solid var(--line);border-top:3px solid var(--ok);
  border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.low{border-top-color:var(--warn)}
.card .img{aspect-ratio:4/3;background:var(--accent-bg);overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .name{font-weight:700;font-size:15px}
.card .qtyrow{display:flex;align-items:baseline;gap:5px}
.card .qty{font-size:38px;font-weight:800;line-height:1}
.card .unit{font-size:13px;color:var(--mid)}
.card .lowtag{display:inline-block;background:var(--warn-bg);color:var(--warn);
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;align-self:flex-start}
.card .note{font-size:12px;color:var(--mid);flex:1}
.card .meta{font-size:10px;color:var(--mid)}
.card .actions{display:flex;gap:8px;border-top:1px solid var(--line);padding:8px 14px}
.card .actions button{flex:1;padding:6px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mid)}
.card .actions .edit:hover{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-bg)}
.card .actions .del:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bg)}

/* FAB */
.fab{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:20}
.fab button{border-radius:24px;padding:14px 20px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(58,53,48,.18)}
.fab .dispense{background:var(--accent);color:#fff}
.fab .restock{background:var(--ok);color:#fff}
.fab .add{background:var(--white);color:var(--accent);border:1px solid var(--line)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(58,53,48,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--white);border-radius:12px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:20px}
.modal h3{font-size:17px;margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--mid);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:none;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:54px}
.field .big{font-size:26px;font-weight:800;text-align:center;padding:12px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.preview{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:9px;padding:10px;margin-bottom:13px}
.preview img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--accent-bg)}
.preview .pstock{font-size:13px;color:var(--mid)}
.preview .pstock b{font-size:22px;color:var(--ink);display:block}
.modal .mbtns{display:flex;gap:10px;margin-top:18px}
.modal .mbtns button{flex:1;padding:11px;border-radius:7px;font-weight:700}
.modal .mbtns .cancel{background:var(--bg);color:var(--mid)}
.modal .mbtns .save{background:var(--accent);color:#fff}

/* Log panel */
.logpanel{position:fixed;top:0;right:0;height:100%;width:360px;max-width:90vw;background:var(--white);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:60;
  display:flex;flex-direction:column}
.logpanel.show{transform:translateX(0)}
.logpanel .lhead{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.logpanel .lhead h3{font-size:16px}
.lfilter{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lfilter select,.lfilter input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:none;color:var(--ink);font-size:13px}
.lfilter select:focus,.lfilter input:focus{border-color:var(--accent)}
.lfilter-row{display:flex;align-items:center;gap:6px}
.lfilter-row input{flex:1;min-width:0}
.lfilter-row span{color:var(--mid);font-size:12px}
.logpanel .llist{flex:1;overflow:auto;padding:8px}
.logitem{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
.logitem img{width:42px;height:42px;border-radius:7px;object-fit:cover;background:var(--accent-bg)}
.logitem .linfo{flex:1;min-width:0}
.logitem .lname{font-weight:600;font-size:13px}
.logitem .lnote{font-size:12px;color:var(--mid)}
.logitem .ltime{font-size:10px;color:var(--mid)}
.logitem .ldelta{font-weight:800;font-size:16px;white-space:nowrap}
.logitem .ldelta.plus{color:var(--ok)}
.logitem .ldelta.minus{color:var(--danger)}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);opacity:0;
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;
  z-index:100;transition:.3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:var(--ok)}
.toast.error{background:var(--danger)}

/* Login / user */
header .user{font-size:12px;color:var(--mid);white-space:nowrap}
.loginbox{max-width:360px}
.loginbox .hint{font-size:12px;color:var(--mid);margin:-6px 0 14px;line-height:1.6}
.logitem .ltype{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--bg);color:var(--mid);margin-right:4px;vertical-align:1px}
.logitem.rev .lname,.logitem.rev .ldelta{text-decoration:line-through;opacity:.55}
.logitem .lrev{align-self:center;flex:none;padding:4px 8px;border-radius:7px;font-size:11px;font-weight:600;color:var(--mid);border:1px solid var(--line)}
.logitem .lrev:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bg)}
.field .sub{font-size:11px;color:var(--mid);margin-top:4px}
/* Stocktake */
.stpanel{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;flex-direction:column}
.stpanel.show{display:flex}
.stpanel .sthead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--line);flex-wrap:wrap}
.stpanel .sthead h3{font-size:16px;flex:1;min-width:120px}
.stpanel .stbody{flex:1;overflow:auto;padding:14px 16px 100px}
.stbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stbar .stat{padding:9px 14px}
.strow{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.strow img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--accent-bg);flex:none}
.strow .sinfo{flex:1;min-width:0}
.strow .sname{font-weight:700;font-size:14px}
.strow .sbook{font-size:12px;color:var(--mid)}
.strow input{width:84px;padding:9px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:18px;font-weight:700;text-align:center;outline:none;color:var(--ink)}
.strow input:focus{border-color:var(--accent)}
.strow .sdiff{width:54px;text-align:right;font-weight:800;font-size:15px;flex:none}
.strow.done{border-left:4px solid var(--ok)}
.strow.diff{border-left:4px solid var(--warn)}
.strow .sdiff.minus{color:var(--danger)} .strow .sdiff.plus{color:var(--ok)} .strow .sdiff.zero{color:var(--mid)}
.strow .sstate{font-size:10px;color:var(--mid);width:36px;text-align:center;flex:none}
.stfoot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px;background:var(--white);border-top:1px solid var(--line);z-index:71}
.stfoot button{flex:1;padding:12px;border-radius:9px;font-weight:700}
.stfoot .cancel{background:var(--bg);color:var(--mid)}
.stfoot .save{background:var(--accent);color:#fff}
.sthist{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sthist .hinfo{flex:1}
.sthist .htitle{font-weight:700}
.sthist .hsub{font-size:12px;color:var(--mid)}
.sthist .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--ok-bg);color:var(--ok)}
.sthist .tag.cancel{background:var(--bg);color:var(--mid)}
.stfilter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.stfilter button{padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;background:var(--white);border:1px solid var(--line);color:var(--mid)}
.stfilter button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font-size:12px}
  #printArea h2{font-size:16px;margin-bottom:4px}
  #printArea p{margin-bottom:10px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #333;padding:7px 6px;text-align:left}
  #printArea td.num{text-align:right;width:70px}
  #printArea td.blank{width:80px}
  #printArea .sign{margin-top:24px;display:flex;gap:40px}
}
.empty{text-align:center;color:var(--mid);padding:60px 20px;grid-column:1/-1}
.errbox{grid-column:1/-1;text-align:center;background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:40px 20px}
.errbox b{display:block;font-size:16px;margin-bottom:6px}
.errbox button{margin-top:14px;padding:9px 18px;border-radius:7px;background:var(--danger);color:#fff;font-weight:700}
</style>
</head>
<body>

<header>
  <div class="logo">🎁 贈品庫存</div>
  <div class="search">
    🔍<input id="search" placeholder="搜尋品名…" oninput="renderCards()">
  </div>
  <button class="hbtn" onclick="openLog()">異動記錄</button>
  <button class="hbtn" onclick="openStocktake()">盤點</button>
  <button class="hbtn" onclick="exportItems()">匯出</button>
  <button class="hbtn" onclick="document.getElementById('importFile').click()">匯入</button>
  <button class="hbtn" onclick="openAccount()">設定</button>
  <span class="user" id="userLabel"></span>
  <input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="importItems(event)">
</header>

<div class="stats" id="stats"></div>
<div class="grid" id="grid"><div class="empty">載入中…</div></div>

<div class="fab">
  <button class="dispense" onclick="openDispenseModal()">📤 拿出贈品</button>
  <button class="restock" onclick="openRestockModal()">📥 補入庫存</button>
  <button class="add" onclick="openItemModal(null)">＋ 新增品項</button>
</div>

<!-- Dispense modal -->
<div class="overlay" id="dispenseOverlay">
  <div class="modal">
    <h3>📤 拿出贈品</h3>
    <div class="field">
      <label>選擇品項</label>
      <select id="dispenseSelect" onchange="onDispenseSelect()"></select>
    </div>
    <div class="preview" id="dispensePreview" style="display:none">
      <img id="dpImg" src="" alt="">
      <div class="pstock">目前庫存<b id="dpStock">0</b></div>
    </div>
    <div class="field">
      <label>拿出數量</label>
      <input type="number" id="dispenseQty" class="big" min="1" value="1">
    </div>
    <div class="field">
      <label>備註（發給誰 / 活動名）</label>
      <input type="text" id="dispenseNote" placeholder="選填" maxlength="300">
    </div>
    <div class="mbtns">
      <button class="cancel" onclick="closeOverlay('dispenseOverlay')">取消</button>
      <button class="save" onclick="doDispense()">確認拿出</button>
    </div>
  </div>
</div>

<!-- Restock modal -->
<div class="overlay" id="restockOverlay">
  <div class="modal">
    <h3>📥 補入庫存</h3>
    <div class="field">
      <label>選擇品項</label>
      <select id="restockSelect" onchange="onRestockSelect()"></select>
    </div>
    <div class="preview" id="restockPreview" style="display:none">
      <img id="rsImg" src="" alt="">
      <div class="pstock">目前庫存<b id="rsStock">0</b></div>
    </div>
    <div class="field">
      <label>補入數量</label>
      <input type="number" id="restockQty" class="big" min="1" value="1">
    </div>
    <div class="field">
      <label>備註（進貨單號 / 來源）</label>
      <input type="text" id="restockNote" placeholder="選填" maxlength="300">
    </div>
    <div class="mbtns">
      <button class="cancel" onclick="closeOverlay('restockOverlay')">取消</button>
      <button class="save" onclick="doRestock()">確認補入</button>
    </div>
  </div>
</div>

<!-- Item modal -->
<div class="overlay" id="itemOverlay">
  <div class="modal">
    <h3 id="itemModalTitle">新增品項</h3>
    <div class="field">
      <label>品名</label>
      <input type="text" id="fName" maxlength="50">
    </div>
    <div class="row2">
      <div class="field"><label id="fQtyLabel">期初數量</label><input type="number" id="fQty" value="0" min="0"><div class="sub" id="fQtyHint" style="display:none">數量請用「拿出／補入」調整</div></div>
      <div class="field"><label>單位</label><input type="text" id="fUnit" value="個" maxlength="10"></div>
    </div>
    <div class="field">
      <label>低庫存警示（0 = 不警示）</label>
      <input type="number" id="fMinAlert" value="0" min="0">
    </div>
    <div class="field">
      <label>備註</label>
      <textarea id="fNote" maxlength="300"></textarea>
    </div>
    <div class="field">
      <label>圖片網址</label>
      <input type="text" id="fImgUrl" placeholder="https://… 或下方上傳" oninput="onImgUrlInput()" maxlength="300">
    </div>
    <div class="field">
      <label>或上傳本地圖片（會自動壓縮）</label>
      <input type="file" id="fImgFile" accept="image/*" onchange="onImgFile(event)">
    </div>
    <div class="preview" id="imgPreviewBox" style="display:none">
      <img id="imgPreview" src="" alt="">
      <div class="pstock">圖片預覽</div>
    </div>
    <div class="mbtns">
      <button class="cancel" onclick="closeOverlay('itemOverlay')">取消</button>
      <button class="save" onclick="saveItem()">儲存</button>
    </div>
  </div>
</div>

<!-- Log panel -->
<div class="logpanel" id="logPanel">
  <div class="lhead">
    <h3>📋 異動記錄</h3>
    <div style="display:flex;gap:6px">
      <button class="hbtn" onclick="exportLogs()">匯出</button>
      <button class="hbtn" onclick="document.getElementById('logPanel').classList.remove('show')">關閉</button>
    </div>
  </div>
  <div class="lfilter">
    <select id="logFilterItem" onchange="renderLogs()"></select>
    <div class="lfilter-row">
      <input type="date" id="logFilterFrom" onchange="renderLogs()">
      <span>～</span>
      <input type="date" id="logFilterTo" onchange="renderLogs()">
      <button class="hbtn" onclick="clearLogFilter()">清除</button>
    </div>
  </div>
  <div class="llist" id="logList"></div>
</div>

<!-- Login -->
<div class="overlay" id="loginOverlay">
  <div class="modal loginbox">
    <h3>🔐 管理者登入</h3>
    <div class="field">
      <label>名稱</label>
      <input type="text" id="loginName" maxlength="20" autocomplete="username" onkeydown="if(event.key==='Enter' && !needPass)doLogin()">
    </div>
    <div class="field" id="loginPassField">
      <label id="loginPassLabel">密碼（第一次登入請輸入初始碼）</label>
      <input type="password" id="loginPass" maxlength="64" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="mbtns">
      <button class="save" onclick="doLogin()">登入</button>
    </div>
  </div>
</div>

<!-- Change passcode -->
<div class="overlay" id="passOverlay">
  <div class="modal loginbox">
    <h3>🔑 設定密碼</h3>
    <div class="hint" id="passHint"></div>
    <div class="field" id="curPassField">
      <label>目前密碼</label>
      <input type="password" id="curPass" maxlength="64" autocomplete="current-password">
    </div>
    <div class="field">
      <label>新密碼（至少 6 字）</label>
      <input type="password" id="newPass" maxlength="64" autocomplete="new-password">
    </div>
    <div class="field">
      <label>再輸入一次</label>
      <input type="password" id="newPass2" maxlength="64" autocomplete="new-password" onkeydown="if(event.key==='Enter')doChangePass()">
    </div>
    <div class="mbtns">
      <button class="cancel" id="passCancel" onclick="closeOverlay('passOverlay')">取消</button>
      <button class="save" onclick="doChangePass()">儲存</button>
    </div>
  </div>
</div>

<!-- Account -->
<div class="overlay" id="accountOverlay">
  <div class="modal loginbox">
    <h3>⚙️ 設定</h3>
    <div class="hint" id="accountHint"></div>
    <div class="mbtns" style="flex-direction:column">
      <button class="cancel" onclick="closeOverlay('accountOverlay');openChangePass(false)">更改密碼</button>
      <button class="cancel" onclick="closeOverlay('accountOverlay');configApi()">後端網址</button>
      <button class="save" onclick="doLogout()">登出</button>
    </div>
  </div>
</div>

<!-- Stocktake -->
<div class="stpanel" id="stPanel">
  <div class="sthead">
    <h3 id="stTitle">📦 盤點</h3>
    <button class="hbtn" id="stPrintBtn" onclick="printStocktake()">列印盤點表</button>
    <button class="hbtn" id="stExportBtn" onclick="exportStocktake()">匯出</button>
    <button class="hbtn" onclick="closeStocktake()">關閉</button>
  </div>
  <div class="stbody" id="stBody"></div>
  <div class="stfoot" id="stFoot"></div>
</div>
<div id="printArea"></div>

<div class="toast" id="toast"></div>

<script>
/* ============ 狀態 ============ */
// 頁面不內嵌任何庫存資料，一律由後端取得
let items = [];
let editingId = null;
let pendingImg = '';        // 預覽用（網址或壓縮後的 data URL）
let pendingUpload = '';     // 待上傳的壓縮圖片（data URL）
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbySMDhdkdVjhx9bnbWj1Dw5pNwIHH57oEFpdQELBeUEuC_TvKNYeKhxzsG-loUw8972/exec';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
const API_URL = lsGet('eink_api_url') || DEFAULT_API_URL;
const IMG_MAX_PX = 800;
const IMPORT_MAX_BYTES = 2 * 1024 * 1024;
const IMPORT_MAX_ROWS = 500;

/* ============ 登入狀態 ============ */
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
let token = lsGet('eink_token') || '';
let openMode = false;   // 後端設定為免登入時為 true
let needPass = true;    // 登入是否需要密碼（由後端告知）
let passwordMode = true;
let userName = lsGet('eink_user') || '';
function setSession(t, name){
  token = t || ''; userName = name || '';
  lsSet('eink_token', token || null); lsSet('eink_user', userName || null);
  document.getElementById('userLabel').textContent = userName ? '👤 '+userName : '';
}

/* ============ API 封裝（全部用 POST，token 不放網址） ============ */
async function apiPost(body){
  let res;
  try{
    // 不帶 Content-Type，避免觸發 CORS 預檢（GAS 仍可讀 e.postData.contents）
    const r = await fetch(API_URL,{method:'POST',body:JSON.stringify({...body, token})});
    res = await r.json();
  }catch(e){
    console.warn(e);
    return { error:'連線失敗，請檢查網路後重試' };
  }
  if(res && res.code==='AUTH'){
    if(res.password===false) needPass = false; else if(res.password===true) needPass = true;
    setSession('',''); showLogin(body.action==='getAll' ? '' : res.error);
  }
  if(res && res.code==='MUST_CHANGE'){ openChangePass(true); }
  return res;
}

/* ============ 工具 ============ */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/** 圖片欄 → 可顯示的網址：雲端硬碟檔案 ID、https 網址、舊的 images/ 路徑 */
function imgSrc(v){
  const s = String(v ?? '').trim();
  if(!s) return '';
  if(/^https:\/\//.test(s)) return s;
  if(/^images\/[\w.-]+$/.test(s)) return s;
  if(/^[\w-]{20,}$/.test(s)) return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(s)+'&sz=w800';
  if(/^data:image\//.test(s)) return s;
  return '';
}
function fmtTime(v){
  const t = new Date(v);
  if(isNaN(t)) return '';
  return `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
}

/* ============ 載入 / 渲染 ============ */
async function loadItems(){
  const res = await apiPost({action:'getAll'});
  if(res.error){
    // 不回退假資料：顯示錯誤，避免照著過期數字發放
    items = [];
    renderStats();
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'errbox';
    box.innerHTML = '<b>無法載入庫存資料</b><div></div><button>重新載入</button>';
    box.querySelector('div').textContent = res.error;
    box.querySelector('button').onclick = ()=>{ grid.innerHTML='<div class="empty">載入中…</div>'; loadItems(); };
    grid.appendChild(box);
    return false;
  }
  items = res.items || [];
  openMode = !!res.openMode;
  passwordMode = res.passwordMode !== false;
  if(res.user) setSession(openMode ? '' : token, res.user);
  renderStats(); renderCards();
  return true;
}
function isLow(it){ return it.低庫存警示>0 && it.數量<=it.低庫存警示; }

function renderStats(){
  const lowCount = items.filter(isLow).length;
  let last = items.reduce((m,i)=> String(i.最後更新)>m ? String(i.最後更新) : m, '');
  let t = last ? new Date(last) : null;
  const hhmm = t && !isNaN(t) ? String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0') : '—';
  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="label">品項總數</span><span class="value">${items.length}</span></div>
    <div class="stat low"><span class="label">低庫存警示</span><span class="value">${lowCount}</span></div>
    <div class="stat"><span class="label">最後更新</span><span class="value">${esc(hhmm)}</span></div>`;
}
function renderCards(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = items.filter(i=> String(i.品名).toLowerCase().includes(q));
  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML = '<div class="empty">沒有符合的品項</div>'; return; }
  grid.innerHTML = '';
  list.forEach(it=> grid.appendChild(buildCard(it)));
}
function buildCard(it){
  const low = isLow(it);
  const div = document.createElement('div');
  div.className = 'card'+(low?' low':'');
  const src = imgSrc(it.圖片);
  div.innerHTML = `
    <div class="img">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:''}</div>
    <div class="body">
      <div class="name">${esc(it.品名)}</div>
      ${low?'<span class="lowtag">⚠ 低庫存</span>':''}
      <div class="qtyrow"><span class="qty">${esc(it.數量)}</span><span class="unit">${esc(it.單位)}</span></div>
      <div class="note">${esc(it.備註)}</div>
      <div class="meta">更新：${esc(fmtTime(it.最後更新))}</div>
    </div>
    <div class="actions">
      <button class="edit">編輯</button>
      <button class="del">刪除</button>
    </div>`;
  const img = div.querySelector('img');
  if(img) img.onerror = ()=>{ img.style.display='none'; };
  div.querySelector('.edit').onclick = ()=>openItemModal(it);
  div.querySelector('.del').onclick = ()=>confirmDelete(it.ID, it.品名);
  return div;
}
function fillItemSelect(sel){
  sel.innerHTML = '<option value="">— 請選擇 —</option>' +
    items.map(i=>`<option value="${esc(i.ID)}">${esc(i.品名)}（${esc(i.數量)}${esc(i.單位)}）</option>`).join('');
}
function setPreviewImg(el, v){
  const src = imgSrc(v);
  el.style.visibility = src ? 'visible' : 'hidden';
  el.src = src;
}

/* ============ 調整數量 ============ */
async function quickAdjust(id, delta, note){
  const res = await apiPost({action:'adjustQty', id, delta, note});
  if(res.error){ showToast(res.error,'error'); return null; }
  await loadItems();
  return res.newQty;
}

function openDispenseModal(){
  fillItemSelect(document.getElementById('dispenseSelect'));
  document.getElementById('dispensePreview').style.display='none';
  document.getElementById('dispenseQty').value = 1;
  document.getElementById('dispenseNote').value = '';
  showOverlay('dispenseOverlay');
}
function onDispenseSelect(){
  const id = document.getElementById('dispenseSelect').value;
  const it = items.find(i=>i.ID===id);
  const box = document.getElementById('dispensePreview');
  if(!it){ box.style.display='none'; return; }
  box.style.display='flex';
  setPreviewImg(document.getElementById('dpImg'), it.圖片);
  document.getElementById('dpStock').textContent = it.數量;
}
async function doDispense(){
  const id = document.getElementById('dispenseSelect').value;
  const it = items.find(i=>i.ID===id);
  if(!it){ showToast('請選擇品項','error'); return; }
  const qty = parseInt(document.getElementById('dispenseQty').value,10);
  if(!qty || qty<=0){ showToast('請輸入有效數量','error'); return; }
  if(qty > it.數量){ showToast('超過庫存數量！','error'); return; }
  const note = document.getElementById('dispenseNote').value;
  // 二次確認，避免手滑連續拿出
  if(!confirm(`確定拿出「${it.品名}」${qty}${it.單位}？\n拿出後剩 ${it.數量 - qty}${it.單位}`)) return;
  const btn = document.querySelector('#dispenseOverlay .save');
  btn.disabled = true; btn.textContent = '處理中…';
  const newQty = await quickAdjust(id, -qty, note);
  btn.disabled = false; btn.textContent = '確認拿出';
  if(newQty!==null){ showToast(`已拿出 ${qty}${it.單位}，剩 ${newQty}`,'success'); closeOverlay('dispenseOverlay'); }
}

function openItemModal(item){
  editingId = item ? item.ID : null;
  pendingUpload = '';
  pendingImg = item ? String(item.圖片||'') : '';
  document.getElementById('itemModalTitle').textContent = item?'編輯品項':'新增品項';
  document.getElementById('fName').value = item?item.品名:'';

  document.getElementById('fUnit').value = item?item.單位:'個';
  document.getElementById('fMinAlert').value = item?item.低庫存警示:0;
  document.getElementById('fNote').value = item?item.備註:'';
  document.getElementById('fImgUrl').value = pendingImg;
  document.getElementById('fImgFile').value = '';
  updateImgPreview();
  showOverlay('itemOverlay');
}
function onImgUrlInput(){
  pendingUpload = '';
  pendingImg = document.getElementById('fImgUrl').value.trim();
  updateImgPreview();
}
/** 讀取圖片並壓縮成最長邊 800px 的 JPEG */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, IMG_MAX_PX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('無法讀取這張圖片')); };
    img.src = url;
  });
}
async function onImgFile(e){
  const f = e.target.files[0];
  if(!f) return;
  try{
    pendingUpload = await compressImage(f);
    pendingImg = pendingUpload;
    document.getElementById('fImgUrl').value = '';
    updateImgPreview();
  }catch(err){ showToast(err.message,'error'); }
}
function updateImgPreview(){
  const box = document.getElementById('imgPreviewBox');
  const src = imgSrc(pendingImg);
  if(src){ box.style.display='flex'; document.getElementById('imgPreview').src = src; }
  else box.style.display='none';
}
async function saveItem(){
  const name = document.getElementById('fName').value.trim();
  if(!name){ showToast('請輸入品名','error'); return; }
  const btn = document.querySelector('#itemOverlay .save');
  btn.disabled = true; btn.textContent = '儲存中…';
  try{
    let imgUrl = document.getElementById('fImgUrl').value.trim();
    if(pendingUpload){
      const up = await apiPost({action:'uploadImage', data:pendingUpload});
      if(up.error){ showToast(up.error,'error'); return; }
      imgUrl = up.id;
    }
    const payload = {
      name,
      qty: document.getElementById('fQty').value,
      unit: document.getElementById('fUnit').value.trim()||'個',
      minAlert: document.getElementById('fMinAlert').value,
      note: document.getElementById('fNote').value,
      imgUrl
    };
    const res = editingId
      ? await apiPost({action:'updateItem', id:editingId, ...payload})
      : await apiPost({action:'addItem', ...payload});
    if(res.error){ showToast(res.error,'error'); return; }
    showToast(editingId?'已更新':'已新增','success');
    closeOverlay('itemOverlay');
    await loadItems();
  }finally{
    btn.disabled = false; btn.textContent = '儲存';
  }
}
async function confirmDelete(id, name){
  const it = items.find(i=>i.ID===id);
  if(it && Number(it.數量)!==0){ showToast(`「${name}」還有 ${it.數量}，請先歸零再刪除`,'error'); return; }
  if(!confirm(`確定刪除「${name}」？`)) return;
  const res = await apiPost({action:'deleteItem', id});
  if(res.error){ showToast(res.error,'error'); return; }
  showToast('已刪除','success');
  await loadItems();
}

/* ============ 異動記錄 ============ */
let allLogs = [];
async function openLog(){
  document.getElementById('logPanel').classList.add('show');
  document.getElementById('logList').innerHTML = '<div class="empty">載入中…</div>';
  const res = await apiPost({action:'getLogs'});
  if(res.error){
    allLogs = [];
    const list = document.getElementById('logList');
    list.innerHTML = '<div class="empty"></div>';
    list.firstChild.textContent = res.error;
    return;
  }
  allLogs = res.logs || [];
  // 填入品項下拉（只含有記錄的品項）
  const sel = document.getElementById('logFilterItem');
  const prev = sel.value;
  const ids = [...new Set(allLogs.map(l=>String(l.品項ID)))];
  sel.innerHTML = '<option value="">全部品項</option>' +
    ids.map(id=>{ const it = items.find(i=>i.ID===id); const nm = it?it.品名:(allLogs.find(l=>String(l.品項ID)===id)||{}).品名||id; return `<option value="${esc(id)}">${esc(nm)}</option>`; }).join('');
  sel.value = prev;
  renderLogs();
}
function filteredLogs(){
  const itemId = document.getElementById('logFilterItem').value;
  const from = document.getElementById('logFilterFrom').value;
  const to = document.getElementById('logFilterTo').value;
  return allLogs.filter(l=>{
    if(itemId && String(l.品項ID)!==itemId) return false;
    const d = new Date(l.時間);
    if(from && d < new Date(from+'T00:00:00')) return false;
    if(to && d > new Date(to+'T23:59:59')) return false;
    return true;
  });
}
function renderLogs(){
  const logs = filteredLogs();
  const list = document.getElementById('logList');
  if(!logs.length){ list.innerHTML = '<div class="empty">沒有符合的記錄</div>'; return; }
  list.innerHTML = logs.map((l, idx)=>{
    const it = items.find(i=>i.ID===String(l.品項ID));
    const src = it ? imgSrc(it.圖片) : '';
    const img = src ? `<img src="${esc(src)}" alt="" loading="lazy">` : '<img alt="" style="visibility:hidden">';
    const d = Number(l.變動量)||0;
    const plus = d>=0;
    const canRev = ['領用','補貨'].includes(l.類型) && !l.已沖銷;
    const revTag = l.已沖銷 ? ` · 已被 ${esc(l.已沖銷)} 沖銷` : '';
    return `<div class="logitem${l.已沖銷?' rev':''}">${img}
      <div class="linfo">
        <div class="lname"><span class="ltype">${esc(l.類型||'')}</span>${esc(l.品名)}</div>
        <div class="lnote">${esc(l.備註)||'—'}${l.操作者?' · '+esc(l.操作者):''}</div>
        <div class="ltime">${esc(fmtTime(l.時間))} · 後 ${esc(l.變動後數量)} · ${esc(l.記錄ID||'')}${revTag}</div>
      </div>
      <div class="ldelta ${plus?'plus':'minus'}">${plus?'+':''}${d}</div>
      ${canRev?`<button class="lrev" data-idx="${idx}">沖銷</button>`:''}
    </div>`;
  }).join('');
  list.querySelectorAll('img').forEach(img=>{ img.onerror = ()=>{ img.style.visibility='hidden'; }; });
  list.querySelectorAll('.lrev').forEach(btn=>{
    btn.onclick = ()=>reverseEntry(logs[+btn.dataset.idx], btn);
  });
}
async function reverseEntry(l, btn){
  const d = Number(l.變動量)||0;
  const reason = prompt(`沖銷「${l.品名}」${d>0?'+':''}${d}？\n庫存會調回 ${-d>0?'+':''}${-d}，並新增一筆沖銷記錄（原記錄保留）。\n\n請輸入沖銷原因：`);
  if(reason===null) return;
  if(!reason.trim()){ showToast('請輸入沖銷原因','error'); return; }
  btn.disabled = true; btn.textContent = '…';
  const res = await apiPost({action:'reverseLog', logId:l.記錄ID, reason});
  if(res.error){ showToast(res.error,'error'); btn.disabled=false; btn.textContent='沖銷'; return; }
  showToast(`已沖銷，${l.品名} 現為 ${res.newQty}`,'success');
  await loadItems();
  await openLog();
}
function clearLogFilter(){
  document.getElementById('logFilterItem').value = '';
  document.getElementById('logFilterFrom').value = '';
  document.getElementById('logFilterTo').value = '';
  renderLogs();
}

/* ============ 匯出 / 匯入 Excel ============ */
function todayStr(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function xlsxReady(){
  if(typeof XLSX==='undefined'){ showToast('Excel 元件載入失敗，請重新整理','error'); return false; }
  return true;
}
function exportItems(){
  if(!xlsxReady()) return;
  if(!items.length){ showToast('沒有資料可匯出','error'); return; }
  const rows = items.map(i=>({
    ID:i.ID, 品名:i.品名, 數量:i.數量, 單位:i.單位,
    低庫存警示:i.低庫存警示, 備註:i.備註, 最後更新:i.最後更新, 圖片:i.圖片
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '庫存');
  XLSX.writeFile(wb, `贈品庫存_${todayStr()}.xlsx`);
  showToast('已匯出庫存 Excel','success');
}
function exportLogs(){
  if(!xlsxReady()) return;
  const logs = filteredLogs();
  if(!logs.length){ showToast('沒有記錄可匯出','error'); return; }
  const ws = XLSX.utils.json_to_sheet(logs);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '異動記錄');
  XLSX.writeFile(wb, `異動記錄_${todayStr()}.xlsx`);
  showToast('已匯出異動記錄 Excel','success');
}
async function importItems(e){
  const f = e.target.files[0];
  if(!f) return;
  e.target.value = '';   // 允許重選同檔
  if(!xlsxReady()) return;
  if(f.size > IMPORT_MAX_BYTES){ showToast('檔案太大（上限 2MB）','error'); return; }
  try{
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    if(!rows.length){ showToast('檔案沒有資料','error'); return; }
    // 以「品名」為必填；有對應 ID 則更新，否則新增
    const valid = rows.filter(r=> String(r.品名||'').trim());
    if(!valid.length){ showToast('找不到「品名」欄','error'); return; }
    if(valid.length > IMPORT_MAX_ROWS){ showToast(`一次最多匯入 ${IMPORT_MAX_ROWS} 筆`,'error'); return; }
    if(!confirm(`將匯入 ${valid.length} 筆品項（既有 ID 會更新，其餘新增）。確定？`)) return;
    showToast(`匯入中…（0/${valid.length}）`,'success');
    let ok=0, fail=0;
    for(let i=0;i<valid.length;i++){
      const r = valid[i];
      const payload = {
        name:String(r.品名).trim(),
        qty:Number(r.數量)||0,
        unit:String(r.單位||'個').trim()||'個',
        minAlert:Number(r.低庫存警示)||0,
        note:String(r.備註||''),
        imgUrl:String(r.圖片||'')
      };
      const idStr = String(r.ID||'').trim();
      const exists = idStr && items.some(it=>it.ID===idStr);
      const res = exists
        ? await apiPost({action:'updateItem', id:idStr, ...payload})
        : await apiPost({action:'addItem', ...payload});
      if(res && res.error){ fail++; } else { ok++; }
    }
    await loadItems();
    showToast(`匯入完成：成功 ${ok}、失敗 ${fail}`, fail?'error':'success');
  }catch(err){ console.warn(err); showToast('匯入失敗，請確認檔案格式','error'); }
}

/* ============ 設定 API ============ */
function configApi(){
  const cur = lsGet('eink_api_url')||'';
  const v = prompt('輸入 Google Apps Script Web App 網址（留空 = 使用預設後端）：', cur);
  if(v===null) return;
  const s = v.trim();
  if(s && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(s)){ showToast('網址格式不正確','error'); return; }
  try{
    if(s) localStorage.setItem('eink_api_url', s);
    else localStorage.removeItem('eink_api_url');
  }catch(e){ showToast('無法儲存設定','error'); return; }
  location.reload();
}

/* ============ 盤點 ============ */
let st = { open:null, details:[], history:[], view:null, viewDetails:[], filter:'all' };
function stDetailMap(list){ const m={}; (list||[]).forEach(d=>m[String(d.品項ID)]=d); return m; }
async function openStocktake(){
  document.getElementById('stPanel').classList.add('show');
  document.body.classList.add('st-open');
  document.getElementById('stBody').innerHTML = '<div class="empty">載入中…</div>';
  document.getElementById('stFoot').innerHTML = '';
  await reloadStocktake();
}
function closeStocktake(){
  document.getElementById('stPanel').classList.remove('show');
  document.body.classList.remove('st-open');
  st.view = null;
  loadItems();
}
async function reloadStocktake(){
  const res = await apiPost({action:'getStocktakes'});
  if(res.error){ document.getElementById('stBody').innerHTML = ''; showToast(res.error,'error'); return; }
  st.open = res.open; st.details = res.details||[]; st.history = res.history||[]; st.view = null;
  if(!items.length) await loadItems();
  renderStocktake();
}
function stDiffHtml(d){
  if(d==null || d==='') return '<div class="sdiff zero">—</div>';
  const n = Number(d);
  return `<div class="sdiff ${n>0?'plus':n<0?'minus':'zero'}">${n>0?'+':''}${n}</div>`;
}
function renderStocktake(){
  const body = document.getElementById('stBody'), foot = document.getElementById('stFoot');
  const title = document.getElementById('stTitle');
  document.getElementById('stPrintBtn').style.display = st.open ? '' : 'none';
  document.getElementById('stExportBtn').style.display = st.view ? '' : 'none';

  if(st.view){ // 歷史明細
    const v = st.view;
    title.textContent = `📦 盤點 ${v.盤點ID}（${v.狀態}）`;
    const rows = st.viewDetails.map(d=>`<div class="strow ${Number(d.差異)?'diff':'done'}">
      <div class="sinfo"><div class="sname">${esc(d.品名)}</div>
      <div class="sbook">帳面 ${esc(d.帳面數量)} → 實點 ${esc(d.實點數量)}${d.備註?' · '+esc(d.備註):''} · ${esc(d.輸入者)}</div></div>
      ${stDiffHtml(d.差異)}</div>`).join('');
    body.innerHTML = `<div class="stbar">
      <div class="stat"><span class="label">開始</span><span class="value">${esc(fmtTime(v.開始時間))}</span></div>
      <div class="stat"><span class="label">完成</span><span class="value">${esc(fmtTime(v.完成時間))||'—'}</span></div>
      <div class="stat"><span class="label">已盤</span><span class="value">${esc(v.已盤)}</span></div>
      <div class="stat low"><span class="label">有差異</span><span class="value">${esc(v.有差異)}</span></div>
      <div class="stat"><span class="label">調整合計</span><span class="value">${esc(v.調整合計)}</span></div></div>
      ${v.備註?`<p style="margin-bottom:10px;color:var(--mid)">${esc(v.備註)}</p>`:''}
      ${rows || '<div class="empty">沒有輸入任何實點</div>'}`;
    foot.innerHTML = '<button class="cancel">返回</button>';
    foot.firstChild.onclick = ()=>{ st.view=null; renderStocktake(); };
    return;
  }

  if(!st.open){ // 沒有進行中：開始 + 歷史
    title.textContent = '📦 盤點';
    const hist = st.history.map((h,i)=>`<div class="sthist">
      <div class="hinfo"><div class="htitle">${esc(h.盤點ID)} <span class="tag ${h.狀態==='已取消'?'cancel':''}">${esc(h.狀態)}</span></div>
      <div class="hsub">${esc(fmtTime(h.開始時間))} · ${esc(h.開始者)} · 已盤 ${esc(h.已盤)} · 差異 ${esc(h.有差異)} 項 · 調整 ${esc(h.調整合計)}${h.備註?' · '+esc(h.備註):''}</div></div>
      <button class="hbtn" data-i="${i}">查看</button></div>`).join('');
    body.innerHTML = `<p style="color:var(--mid);margin-bottom:14px;line-height:1.7">
      開始後逐項輸入實際點到的數量，系統會自動算出差異。盤點期間照常可以拿出、補入。<br>
      按「完成盤點」才會一次調整庫存；完成前隨時可以修改或取消。</p>
      <h4 style="margin:6px 0 10px">過去的盤點</h4>${hist || '<div class="empty" style="padding:20px">還沒有盤點記錄</div>'}`;
    body.querySelectorAll('.sthist button').forEach(b=> b.onclick = ()=>viewStocktake(st.history[+b.dataset.i]));
    foot.innerHTML = '<button class="save">＋ 開始盤點</button>';
    foot.firstChild.onclick = startStocktake;
    return;
  }

  // 進行中
  const o = st.open, map = stDetailMap(st.details);
  title.textContent = `📦 盤點 ${o.盤點ID} 進行中`;
  const counted = items.filter(i=>map[i.ID]).length;
  const diffs = items.filter(i=>map[i.ID] && Number(map[i.ID].差異)!==0).length;
  const list = items.filter(i=> st.filter==='all' || (st.filter==='todo' && !map[i.ID]) || (st.filter==='diff' && map[i.ID] && Number(map[i.ID].差異)!==0));
  body.innerHTML = `<div class="stbar">
      <div class="stat"><span class="label">進度</span><span class="value">${counted} / ${items.length}</span></div>
      <div class="stat low"><span class="label">有差異</span><span class="value">${diffs}</span></div>
      <div class="stat"><span class="label">開始</span><span class="value">${esc(fmtTime(o.開始時間))}</span></div></div>
    <div class="stfilter">
      <button data-f="all" class="${st.filter==='all'?'on':''}">全部</button>
      <button data-f="todo" class="${st.filter==='todo'?'on':''}">未盤 ${items.length-counted}</button>
      <button data-f="diff" class="${st.filter==='diff'?'on':''}">有差異 ${diffs}</button></div>
    <div id="stList">${list.map(it=>{
      const d = map[it.ID]; const src = imgSrc(it.圖片);
      const cls = d ? (Number(d.差異)?'diff':'done') : '';
      return `<div class="strow ${cls}" data-id="${esc(it.ID)}">
        ${src?`<img src="${esc(src)}" alt="" loading="lazy">`:'<img alt="" style="visibility:hidden">'}
        <div class="sinfo"><div class="sname">${esc(it.品名)}</div>
        <div class="sbook">帳面 <b>${esc(it.數量)}</b> ${esc(it.單位)}${d?` · 輸入時帳面 ${esc(d.帳面數量)}`:''}</div></div>
        <input type="number" inputmode="numeric" min="0" placeholder="實點" value="${d?esc(d.實點數量):''}">
        ${stDiffHtml(d?d.差異:null)}
        <div class="sstate">${d?'✓':''}</div></div>`;
    }).join('') || '<div class="empty">沒有符合的品項</div>'}</div>`;
  body.querySelectorAll('.stfilter button').forEach(b=> b.onclick = ()=>{ st.filter=b.dataset.f; renderStocktake(); });
  body.querySelectorAll('.strow img').forEach(img=>{ img.onerror=()=>{ img.style.visibility='hidden'; }; });
  body.querySelectorAll('.strow input').forEach(inp=>{
    inp.onchange = ()=>saveCount(inp.closest('.strow').dataset.id, inp);
    inp.onkeydown = e=>{ if(e.key==='Enter'){ inp.blur(); const rows=[...body.querySelectorAll('.strow input')]; const n=rows[rows.indexOf(inp)+1]; if(n) n.focus(); } };
  });
  foot.innerHTML = '<button class="cancel">取消盤點</button><button class="save">完成盤點</button>';
  foot.children[0].onclick = cancelStocktake;
  foot.children[1].onclick = finalizeStocktake;
}
async function startStocktake(){
  const note = prompt('開始新的盤點。\n備註（選填，例如「2026 Q3 盤點」）：', '');
  if(note===null) return;
  const res = await apiPost({action:'startStocktake', note});
  if(res.error){ showToast(res.error,'error'); return; }
  showToast(`已建立盤點單 ${res.stId}`,'success');
  st.filter = 'all';
  await reloadStocktake();
}
async function saveCount(itemId, inp){
  const v = inp.value.trim();
  if(v===''){ return; }
  const n = Number(v);
  if(!Number.isInteger(n) || n<0){ showToast('實點數量需為 0 以上的整數','error'); return; }
  const row = inp.closest('.strow'); const state = row.querySelector('.sstate');
  state.textContent = '…';
  const res = await apiPost({action:'saveCount', stId:st.open.盤點ID, itemId, counted:n});
  if(res.error){ state.textContent = '!'; showToast(res.error,'error'); return; }
  const it = items.find(i=>i.ID===itemId);
  st.details = st.details.filter(d=>String(d.品項ID)!==itemId);
  st.details.push({品項ID:itemId, 品名:it?it.品名:'', 帳面數量:res.book, 實點數量:res.counted, 差異:res.diff});
  // 只更新這一列與統計，避免打斷連續輸入
  row.className = 'strow ' + (res.diff ? 'diff' : 'done');
  row.querySelector('.sdiff').outerHTML = stDiffHtml(res.diff);
  state.textContent = '✓';
  const map = stDetailMap(st.details);
  const counted = items.filter(i=>map[i.ID]).length, diffs = items.filter(i=>map[i.ID] && Number(map[i.ID].差異)!==0).length;
  const vals = document.querySelectorAll('#stBody .stbar .value');
  if(vals[0]) vals[0].textContent = `${counted} / ${items.length}`;
  if(vals[1]) vals[1].textContent = diffs;
  const fb = document.querySelectorAll('#stBody .stfilter button');
  if(fb[1]) fb[1].textContent = `未盤 ${items.length-counted}`;
  if(fb[2]) fb[2].textContent = `有差異 ${diffs}`;
}
async function finalizeStocktake(){
  const map = stDetailMap(st.details);
  const counted = items.filter(i=>map[i.ID]);
  if(!counted.length){ showToast('還沒有輸入任何實點數量','error'); return; }
  const diffs = counted.filter(i=>Number(map[i.ID].差異)!==0);
  const lines = diffs.slice(0,12).map(i=>`・${i.品名}：${Number(map[i.ID].差異)>0?'+':''}${map[i.ID].差異}`).join('\n');
  const todo = items.length - counted.length;
  const msg = `完成盤點 ${st.open.盤點ID}？\n\n已盤 ${counted.length} 項${todo?`（還有 ${todo} 項未盤，不會調整）`:''}\n`
    + (diffs.length ? `將調整 ${diffs.length} 項：\n${lines}${diffs.length>12?'\n…':''}` : '全部相符，不需調整。')
    + '\n\n完成後無法修改。';
  if(!confirm(msg)) return;
  const btn = document.querySelector('#stFoot .save'); btn.disabled = true; btn.textContent = '處理中…';
  const res = await apiPost({action:'finalizeStocktake', stId:st.open.盤點ID});
  btn.disabled = false; btn.textContent = '完成盤點';
  if(res.error){ showToast(res.error,'error'); return; }
  showToast(`盤點完成，調整 ${res.adjusted} 項`,'success');
  await loadItems();
  await reloadStocktake();
}
async function cancelStocktake(){
  if(!confirm(`取消盤點 ${st.open.盤點ID}？\n已輸入的實點數量會保留在記錄中，但不會調整庫存。`)) return;
  const res = await apiPost({action:'cancelStocktake', stId:st.open.盤點ID});
  if(res.error){ showToast(res.error,'error'); return; }
  showToast('已取消盤點','success');
  await reloadStocktake();
}
async function viewStocktake(h){
  const res = await apiPost({action:'getStocktakeDetail', stId:h.盤點ID});
  if(res.error){ showToast(res.error,'error'); return; }
  st.view = res.stocktake; st.viewDetails = res.details||[];
  renderStocktake();
}
function printStocktake(){
  if(!st.open) return;
  const map = stDetailMap(st.details);
  const d = new Date();
  const area = document.getElementById('printArea');
  area.innerHTML = `<h2>贈品盤點表　${esc(st.open.盤點ID)}</h2>
    <p>列印時間：${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}　${st.open.備註?'備註：'+esc(st.open.備註):''}</p>
    <table><thead><tr><th>#</th><th>品名</th><th>單位</th><th>帳面</th><th>實點</th><th>備註</th></tr></thead>
    <tbody>${items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.品名)}</td><td>${esc(it.單位)}</td>
      <td class="num">${esc(it.數量)}</td><td class="blank">${map[it.ID]?esc(map[it.ID].實點數量):''}</td><td></td></tr>`).join('')}</tbody></table>
    <div class="sign"><span>盤點人：＿＿＿＿＿＿</span><span>覆核：＿＿＿＿＿＿</span><span>日期：＿＿＿＿＿＿</span></div>`;
  window.print();
}
function exportStocktake(){
  if(!xlsxReady() || !st.view) return;
  const rows = st.viewDetails.map(d=>({ 品項ID:d.品項ID, 品名:d.品名, 帳面數量:d.帳面數量, 實點數量:d.實點數量, 差異:d.差異, 備註:d.備註, 輸入者:d.輸入者, 輸入時間:d.輸入時間, 調整記錄ID:d.調整記錄ID }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{說明:'沒有明細'}]), '盤點明細');
  XLSX.writeFile(wb, `盤點_${st.view.盤點ID}_${todayStr()}.xlsx`);
  showToast('已匯出盤點明細','success');
}

/* ============ 登入 / 密碼 ============ */
function showLogin(msg){
  document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));
  document.getElementById('logPanel').classList.remove('show');
  document.getElementById('stPanel').classList.remove('show');
  document.body.classList.remove('st-open');
  document.getElementById('loginPass').value = '';
  document.getElementById('loginPassField').style.display = needPass ? '' : 'none';
  if(userName) document.getElementById('loginName').value = userName;
  showOverlay('loginOverlay');
  if(msg) showToast(msg,'error');
  setTimeout(()=>document.getElementById(needPass && document.getElementById('loginName').value?'loginPass':'loginName').focus(), 50);
}
async function doLogin(){
  const name = document.getElementById('loginName').value.trim();
  const passcode = document.getElementById('loginPass').value;
  if(!name || (needPass && !passcode)){ showToast(needPass ? '請輸入名稱與密碼' : '請輸入名稱','error'); return; }
  const btn = document.querySelector('#loginOverlay .save');
  btn.disabled = true; btn.textContent = '登入中…';
  const res = await apiPost({action:'login', name, passcode});
  btn.disabled = false; btn.textContent = '登入';
  document.getElementById('loginPass').value = '';
  if(res.error){ showToast(res.error,'error'); return; }
  setSession(res.token, res.name);
  closeOverlay('loginOverlay');
  if(res.mustChange){ openChangePass(true); return; }
  showToast(`歡迎，${res.name}`,'success');
  loadItems();
}
let passForced = false;
function openChangePass(forced){
  passForced = forced;
  document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));
  document.getElementById('passHint').textContent = forced ? '第一次登入，請設定你自己的密碼（初始碼將失效）。' : '';
  document.getElementById('curPassField').style.display = forced ? 'none' : 'block';
  document.getElementById('passCancel').style.display = forced ? 'none' : 'block';
  ['curPass','newPass','newPass2'].forEach(id=>document.getElementById(id).value='');
  showOverlay('passOverlay');
}
async function doChangePass(){
  const passcode = document.getElementById('curPass').value;
  const newPasscode = document.getElementById('newPass').value;
  if(newPasscode.length < 6){ showToast('新密碼至少 6 字','error'); return; }
  if(newPasscode !== document.getElementById('newPass2').value){ showToast('兩次輸入的新密碼不一樣','error'); return; }
  const res = await apiPost({action:'changePasscode', passcode, newPasscode});
  ['curPass','newPass','newPass2'].forEach(id=>document.getElementById(id).value='');
  if(res.error){ if(res.code!=='AUTH') showToast(res.error,'error'); return; }
  setSession(res.token, res.name);
  closeOverlay('passOverlay');
  showToast('密碼已更新','success');
  if(passForced) loadItems();
}
function openAccount(){
  document.getElementById('accountHint').textContent = openMode
    ? `目前為免登入模式，操作者記為「${userName}」` : (userName ? `目前登入：${userName}` : '');
  document.querySelectorAll('#accountOverlay .mbtns button').forEach((b,i)=>{
    const hide = (openMode && i!==1) || (!passwordMode && i===0);
    b.style.display = hide ? 'none' : '';
  });
  showOverlay('accountOverlay');
}
async function doLogout(){
  closeOverlay('accountOverlay');
  await apiPost({action:'logout'});
  setSession('','');
  items = []; renderStats();
  document.getElementById('grid').innerHTML = '';
  showLogin();
}

/* ============ Toast / Overlay ============ */
let toastTimer;
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show '+(type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className='toast '+(type||''), 2600);
}
function showOverlay(id){ document.getElementById(id).classList.add('show'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click', e=>{
    if(e.target!==o) return;
    if(o.id==='loginOverlay' || (o.id==='passOverlay' && passForced)) return;
    o.classList.remove('show');
  });
});

/* ============ 啟動 ============ */
setSession(token, userName);
loadItems();   // 需要登入時，後端回 AUTH 會自動顯示登入框
</script>
