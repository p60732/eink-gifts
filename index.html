<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E Ink 贈品庫存管理</title>
<style>
:root{
  --ink:#0f172a; --ink2:#1e293b; --mid:#64748b; --mute:#94a3b8;
  --line:#e2e8f0; --soft:#f1f5f9; --bg:#ffffff; 
  --primary:#0f172a; --primary-h:#1e293b;
  --ok:#16a34a; --ok-bg:#dcfce7;
  --danger:#dc2626; --danger-bg:#fee2e2;
  --radius:16px; --shadow:0 1px 2px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08);transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-h)}
.btn svg.ic{width:18px;height:18px}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mid);white-space:nowrap}
.hbtn:hover{background:var(--soft);color:var(--ink)}
.hbtn svg.ic{width:16px;height:16px}

/* ---------- Hero ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.hero{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.hero .top{display:flex;align-items:flex-start;gap:12px}
.hero .top .titles{flex:1;min-width:0}
.eyebrow{font-size:13px;letter-spacing:.22em;color:var(--mid);font-weight:500;margin-bottom:10px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.25}
.hero .sub{color:var(--mid);font-size:16px;margin-top:8px;line-height:1.6}
.hero .tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.user{font-size:13px;color:var(--mid);padding:0 6px;white-space:nowrap}
.hero .tools .sync{font-size:12px;color:var(--mid);background:#f1f3f6;border-radius:999px;padding:2px 10px;margin-left:6px}
.stremind{padding:12px 14px;border-radius:12px;background:#f1f3f6;color:var(--mid);font-size:14px;margin-bottom:12px}
.stremind.due{background:#fdecea;color:#b42318;font-weight:600}
.hero .actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}

/* ---------- KPI cards ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:26px 0 8px}
.kpi{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.kpi .icon{width:52px;height:52px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.kpi .icon.danger{background:var(--danger-bg);color:var(--danger)}
.kpi .label{font-size:14px;color:var(--mid)}
.kpi .value{font-size:26px;font-weight:800;margin-top:2px;line-height:1.2}
.kpi .value.small{font-size:20px}
/* small stat chips (盤點統計) */
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:baseline;gap:8px}
.stat .label{font-size:12px;color:var(--mid)}
.stat .value{font-size:17px;font-weight:800}
.stat.low .value{color:var(--danger)}

/* ---------- Tabs ---------- */
.tabs{display:inline-flex;gap:4px;background:var(--soft);border-radius:14px;padding:5px;margin:22px 0 18px;max-width:100%;overflow-x:auto}
.tabs button{padding:9px 20px;border-radius:10px;font-size:15px;font-weight:600;color:var(--mid);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.view{display:none;padding-bottom:40px}
.view.on{display:block}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;max-width:420px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px}
.search svg.ic{width:18px;height:18px;color:var(--mute)}
.search input{flex:1;border:none;background:none;padding:11px 0;outline:none}

/* ---------- Item cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card .img{aspect-ratio:4/3;background:var(--soft);overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .name{font-weight:700;font-size:16px}
.card .qtyrow{display:flex;align-items:baseline;gap:6px}
.card .qty{font-size:34px;font-weight:800;line-height:1.1}
.card .unit{font-size:14px;color:var(--mid)}
.card .lowtag{display:inline-flex;align-items:center;gap:4px;background:var(--danger-bg);color:var(--danger);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;align-self:flex-start}
.card.low .qty{color:var(--danger)}
.card .note{font-size:13px;color:var(--mid);flex:1;line-height:1.5}
.card .meta{font-size:12px;color:var(--mute)}
.card .actions{display:flex;gap:8px;border-top:1px solid var(--line);padding:12px 18px}
.card .actions button{flex:1;padding:8px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--ink2);background:#fff}
.card .actions .edit:hover{background:var(--soft)}
.card .actions .del:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bg)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.modal h3{font-size:19px;font-weight:800;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mid);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.field input:disabled{background:var(--soft);color:var(--mid)}
.field textarea{resize:vertical;min-height:60px}
.field .big{font-size:28px;font-weight:800;text-align:center;padding:12px}
.field .sub{font-size:12px;color:var(--mid);margin-top:5px}
.row2{display:flex;gap:12px}.row2>*{flex:1}
.preview{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:14px;padding:12px;margin-bottom:14px}
.preview img{width:62px;height:62px;border-radius:10px;object-fit:cover;background:#fff}
.preview .pstock{font-size:13px;color:var(--mid)}
.preview .pstock b{font-size:24px;color:var(--ink);display:block}
.modal .mbtns{display:flex;gap:10px;margin-top:20px}
.modal .mbtns button{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:15px}
.modal .mbtns .cancel{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.modal .mbtns .cancel:hover{background:var(--soft)}
.modal .mbtns .save{background:var(--primary);color:#fff}
.modal .mbtns .save:hover{background:var(--primary-h)}
.loginbox{max-width:380px}
.prow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow .pname{flex:1;min-width:140px}
.prow .pname input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;outline:none}
.prow .pname input:focus{border-color:var(--ink)}
.prow .pmeta{font-size:12px;color:var(--mute);margin-top:4px}
.prow .me{font-size:11px;font-weight:700;background:var(--soft);color:var(--mid);padding:1px 7px;border-radius:999px;margin-left:4px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);white-space:nowrap;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--primary)}
.prow .pbtns{display:flex;gap:6px}
.prow .pbtns button{padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.prow .pbtns button.save{background:var(--primary);color:#fff;border-color:var(--primary)}
.prow.off .pname input{color:var(--mute);text-decoration:line-through}
.padd{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.padd input[type=text]{flex:1;min-width:150px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;outline:none}
.padd input[type=text]:focus{border-color:var(--ink)}
.loginbox .hint{font-size:13px;color:var(--mid);margin:-8px 0 14px;line-height:1.6}

/* ---------- Logs ---------- */
.lfilter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.lfilter select,.lfilter input{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:14px}
.lfilter select{min-width:160px}
.lfilter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lfilter-row span{color:var(--mid);font-size:13px}
.llist{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.logitem{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.logitem:last-child{border-bottom:none}
.logmore{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;color:var(--mid);font-size:13px}
.logmore .btn{padding:8px 16px;font-size:14px}
.logitem img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}
.logitem .linfo{flex:1;min-width:0}
.logitem .lname{font-weight:700;font-size:15px}
.logitem .lnote{font-size:13px;color:var(--mid);margin-top:2px}
.logitem .ltime{font-size:12px;color:var(--mute);margin-top:2px}
.logitem .ldelta{font-weight:800;font-size:17px;white-space:nowrap}
.logitem .ldelta.plus{color:var(--ok)}
.logitem .ldelta.minus{color:var(--danger)}
.logitem .ltype{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mid);margin-right:6px;vertical-align:2px}
.logitem.rev .lname,.logitem.rev .ldelta{text-decoration:line-through;opacity:.5}
.logitem .lrev{flex:none;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line);background:#fff}
.logitem .lrev:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bg)}

/* ---------- Stocktake ---------- */
.sthead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sthead h3{font-size:18px;font-weight:800;flex:1;min-width:160px}
.stbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.strow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.strow img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}
.strow .sinfo{flex:1;min-width:0}
.strow .sname{font-weight:700;font-size:15px}
.strow .sbook{font-size:13px;color:var(--mid)}
.strow input{width:90px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px;font-weight:800;text-align:center;outline:none}
.strow input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.strow .sdiff{width:54px;text-align:right;font-weight:800;font-size:16px;flex:none}
.strow.done{border-left:4px solid var(--ok)}
.strow.diff{border-left:4px solid var(--danger)}
.strow .sdiff.minus{color:var(--danger)} .strow .sdiff.plus{color:var(--ok)} .strow .sdiff.zero{color:var(--mute)}
.strow .sstate{font-size:12px;color:var(--ok);width:22px;text-align:center;flex:none}
.stfoot{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:12px;padding:14px 22px;background:#fff;border-top:1px solid var(--line);z-index:60}
body.st-open .stfoot{display:flex}
body.st-open .view.on{padding-bottom:100px}
.stfoot button{flex:1;max-width:400px;padding:13px;border-radius:12px;font-weight:700;font-size:15px}
.stfoot .cancel{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.stfoot .save{background:var(--primary);color:#fff}
.sthist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.sthist .hinfo{flex:1}
.sthist .htitle{font-weight:700}
.sthist .hsub{font-size:13px;color:var(--mid);margin-top:3px}
.sthist .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok);margin-left:4px}
.sthist .tag.cancel{background:var(--soft);color:var(--mid)}
.stfilter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stfilter button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--mid)}
.stfilter button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.stintro{color:var(--mid);margin-bottom:18px;line-height:1.8}

/* ---------- Toast / misc ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);opacity:0;background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;z-index:100;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(15,23,42,.25);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:var(--ink)}
.toast.error{background:var(--danger)}
body.st-open .toast{bottom:96px}
.empty{text-align:center;color:var(--mid);padding:56px 20px;grid-column:1/-1}
.errbox{grid-column:1/-1;text-align:center;background:var(--danger-bg);color:var(--danger);border-radius:var(--radius);padding:40px 20px}
.errbox b{display:block;font-size:17px;margin-bottom:6px}
.errbox button{margin-top:14px;padding:10px 20px;border-radius:12px;background:var(--danger);color:#fff;font-weight:700}

#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font-size:12px}
  #printArea h2{font-size:16px;margin-bottom:4px}
  #printArea p{margin-bottom:10px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #333;padding:7px 6px;text-align:left}
  #printArea td.num{text-align:right;width:70px}
  #printArea td.blank{width:80px}
  #printArea .sign{margin-top:24px;display:flex;gap:40px}
}

/* ---------- Responsive ---------- */
@media (max-width:900px){ .stats{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){
  .wrap{padding:0 18px}
  .hero{padding:24px 0 22px}
  .hero .top{flex-direction:column-reverse;gap:6px}
  .hero .tools{justify-content:flex-start;margin-left:-8px}
  .hero h1{font-size:28px}
  .hero .sub{font-size:15px}
  .stats{grid-template-columns:1fr;gap:12px;padding-top:22px}
  .kpi{padding:18px 20px}
  .tabs{display:flex;width:100%}
  .tabs button{flex:1;padding:9px 10px}
  .search{max-width:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card .body{padding:12px 14px}
  .card .qty{font-size:28px}
  .card .actions{padding:10px 12px}
  .logitem{padding:12px 14px;gap:10px}
  .strow input{width:74px}
  .stfoot{padding:12px 16px}
}
</style>
</head>
<body>

<div class="wrap">
  <section class="hero">
    <div class="top">
      <div class="titles">
        <div class="eyebrow">INVENTORY &amp; GIFTS</div>
        <h1>E Ink 贈品庫存</h1>
        <p class="sub">登記拿出與補入、定期盤點，一頁看清庫存數量與低庫存狀況。</p>
      </div>
      <div class="tools">
        <button class="hbtn" onclick="exportItems()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>匯出</button>
        <button class="hbtn" onclick="document.getElementById('importFile').click()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>匯入</button>
        <button class="hbtn" onclick="openAccount()"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>設定</button>
        <span class="user" id="userLabel"></span>
        <span class="sync" id="syncTag" style="display:none">同步中…</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="openDispenseModal()"><svg class="ic" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>拿出贈品</button>
      <button class="btn" onclick="openRestockModal()"><svg class="ic" viewBox="0 0 24 24"><path d="M17 7 7 17"/><path d="M16 17H7V8"/></svg>補入庫存</button>
      <button class="btn primary" onclick="openItemModal(null)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增品項</button>
    </div>
    <input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="importItems(event)">
  </section>

  <div class="stats" id="stats"></div>

  <nav class="tabs" id="tabs">
    <button data-tab="items" class="on" onclick="switchTab('items')">庫存品項</button>
    <button data-tab="logs" onclick="switchTab('logs')">異動記錄</button>
    <button data-tab="st" onclick="switchTab('st')">盤點</button>
  </nav>

  <section class="view on" id="view-items">
    <div class="toolbar">
      <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="搜尋品名…" oninput="renderCards()"></div>
    </div>
    <div class="grid" id="grid"><div class="empty">載入中…</div></div>
  </section>

  <section class="view" id="view-logs">
    <div class="lfilter">
      <select id="logFilterItem" onchange="loadLogs(false)"></select>
      <div class="lfilter-row">
        <input type="date" id="logFilterFrom" onchange="loadLogs(false)">
        <span>～</span>
        <input type="date" id="logFilterTo" onchange="loadLogs(false)">
        <button class="hbtn" onclick="clearLogFilter()">清除</button>
      </div>
      <button class="hbtn" onclick="exportLogs()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>匯出</button>
    </div>
    <div class="llist" id="logList"></div>
  </section>

  <section class="view" id="view-st">
    <div>
      <div class="sthead">
        <h3 id="stTitle">盤點</h3>

<script>
/* ============ 狀態 ============ */
// 頁面不內嵌任何庫存資料，一律由後端取得
let items = [];
let editingId = null;
let pendingImg = '';        // 預覽用（網址或壓縮後的 data URL）
let pendingUpload = '';     // 待上傳的壓縮圖片（data URL）
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbySMDhdkdVjhx9bnbWj1Dw5pNwIHH57oEFpdQELBeUEuC_TvKNYeKhxzsG-loUw8972/exec';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
const API_URL = lsGet('eink_api_url') || DEFAULT_API_URL;
const IMG_MAX_PX = 800;
const IMPORT_MAX_BYTES = 2 * 1024 * 1024;
const IMPORT_MAX_ROWS = 500;

/* ============ 登入狀態 ============ */
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
let token = lsGet('eink_token') || '';
let openMode = false;   // 後端設定為免登入時為 true
let needPass = true;    // 登入是否需要密碼（由後端告知：getAll 的 passwordMode 或 AUTH 回應）
let canManage = false;
let lastBackup = '';
let userName = lsGet('eink_user') || '';
function setSession(t, name){
  token = t || ''; userName = name || '';
  lsSet('eink_token', token || null); lsSet('eink_user', userName || null);
  document.getElementById('userLabel').textContent = userName ? userName : '';
}

/* ============ API 封裝（全部用 POST，token 不放網址） ============ */
const READ_ACTIONS = ['getAll','getLogs','getStocktakes','getStocktakeDetail','listAdmins'];
/** 單次請求；超過 ms 毫秒就放棄（Google 偶爾會卡住連線） */
async function postOnce(payload, ms){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms);
  try{
    // 不帶 Content-Type，避免觸發 CORS 預檢（GAS 仍可讀 e.postData.contents）
    const r = await fetch(API_URL,{method:'POST',body:payload,signal:ctl.signal});
    return await r.json();
  } finally { clearTimeout(timer); }
}
const GET_BOUNCE_MSG = '請使用贈品庫存網頁';   // 與 Code.gs doGet 的訊息相同
function isGetBounce(res){ return !!res && res.error === GET_BOUNCE_MSG && !res.code; }
async function apiPost(body){
  let res;
  const payload = JSON.stringify({...body, token});
  const isRead = READ_ACTIONS.includes(body.action);
  try{
    // 讀取：10 秒沒回應就自動重試一次；寫入不重試，避免重複登記
    try{ res = await postOnce(payload, isRead ? 10000 : 45000); }
    catch(e){ if(!isRead) throw e; res = await postOnce(payload, 20000); }
    // Google 偶爾把 POST 轉成 GET（回的是 doGet 的訊息）：伺服器什麼都沒做，重送一次一定安全
    if(isGetBounce(res)) res = await postOnce(payload, isRead ? 20000 : 45000);
    if(isGetBounce(res)) res = { error:'連線不穩，請稍後再試' };
  }catch(e){
    console.warn(e);
    return { error: isRead ? '連線失敗，請檢查網路後重試' : '連線逾時，請重新整理確認是否已完成，再決定是否重做' };
  }
  if(res && res.code==='AUTH'){
    if(res.password===false) needPass = false; else if(res.password===true) needPass = true;
    setSession('',''); showLogin(body.action==='getAll' ? '' : res.error);
  }
  if(res && res.code==='MUST_CHANGE'){ openChangePass(true); }
  return res;
}

/* ============ 工具 ============ */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/** 圖片欄 → 可顯示的網址：雲端硬碟檔案 ID、https 網址、舊的 images/ 路徑 */
function imgSrc(v){
  const s = String(v ?? '').trim();
  if(!s) return '';
  if(/^https:\/\//.test(s)) return s;
  if(/^images\/[\w.-]+$/.test(s)) return s;
  if(/^[\w-]{20,}$/.test(s)) return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(s)+'&sz=w800';
  if(/^data:image\//.test(s)) return s;
  return '';
}
function fmtTime(v){
  const t = new Date(v);
  if(isNaN(t)) return '';
  return `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
}

/* ============ 載入 / 渲染 ============ */
const ITEMS_CACHE = 'eink_items_cache';
function saveItemsCache(){ lsSet(ITEMS_CACHE, JSON.stringify({ t: Date.now(), user: userName, open: openMode, items })); }
/** 開頁時先顯示上次的庫存（標示同步中），同時向後端要最新資料 */
function showCachedItems(){
  try{
    const c = JSON.parse(lsGet(ITEMS_CACHE) || 'null');
    if(!c || !Array.isArray(c.items)) return false;
    // 需要登入時只顯示同一位使用者的快取；免登入模式不需要 token
    if(!(c.open || (token && c.user === userName))) return false;
    items = c.items; renderStats(); renderCards(); setSyncing(true);
    return true;
  }catch(e){ return false; }
}
function setSyncing(on){
  const el = document.getElementById('syncTag');
  if(el) el.style.display = on ? '' : 'none';
}
function updateLocalItem(id, qty){
  const it = items.find(i=>i.ID===id);
  if(!it) return false;
  it.數量 = qty; it.最後更新 = new Date().toISOString();
  renderStats(); renderCards(); saveItemsCache();
  return true;
}
async function loadItems(){
  const res = await apiPost({action:'getAll'});
  setSyncing(false);
  if(res.error){
    lsSet(ITEMS_CACHE, null);
    // 不回退假資料：顯示錯誤，避免照著過期數字發放
    items = [];
    renderStats();
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'errbox';
    box.innerHTML = '<b>無法載入庫存資料</b><div></div><button>重新載入</button>';
    box.querySelector('div').textContent = res.error;
    box.querySelector('button').onclick = ()=>{ grid.innerHTML='<div class="empty">載入中…</div>'; loadItems(); };
    grid.appendChild(box);
    return false;
  }
  items = res.items || [];
  openMode = !!res.openMode;
  needPass = res.passwordMode !== false;
  canManage = !!res.canManage;
  lastBackup = res.lastBackup || '';
  if(res.user) setSession(openMode ? '' : token, res.user);
  renderStats(); renderCards(); saveItemsCache();
  return true;
}
function isLow(it){ return it.低庫存警示>0 && it.數量<=it.低庫存警示; }

const ICONS = {"box": "<path d=\"M21 8 12 3 3 8v8l9 5 9-5V8Z\"/><path d=\"m3 8 9 5 9-5\"/><path d=\"M12 13v8\"/>", "boxes": "<path d=\"M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z\"/><path d=\"m7 16.5-4.74-2.85\"/><path d=\"m7 16.5 5-3\"/><path d=\"M7 16.5v5.17\"/><path d=\"M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z\"/><path d=\"m17 16.5-5-3\"/><path d=\"m17 16.5 4.74-2.85\"/><path d=\"M17 16.5v5.17\"/><path d=\"M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z\"/><path d=\"M12 8 7.26 5.15\"/><path d=\"m12 8 4.74-2.85\"/><path d=\"M12 13.5V8\"/>", "alert": "<path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>"};
const icon = n => `<svg class="ic" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
function renderStats(){
  const lowCount = items.filter(isLow).length;
  const total = items.reduce((n,i)=> n + (Number(i.數量)||0), 0);
  let last = items.reduce((m,i)=> String(i.最後更新)>m ? String(i.最後更新) : m, '');
  const lt = last ? fmtTime(last) : '';
  const kpi = (ic, label, value, cls='', vcls='') => `<div class="kpi"><div class="icon ${cls}">${icon(ic)}</div><div><div class="label">${label}</div><div class="value ${vcls}">${value}</div></div></div>`;
  document.getElementById('stats').innerHTML =
    kpi('boxes','品項種類', items.length) +
    kpi('box','庫存總量', total.toLocaleString()) +
    kpi('alert','低庫存警示', lowCount, lowCount ? 'danger' : '') +
    kpi('clock','最後更新', esc(lt) || '—', '', 'small');
}
function switchTab(t){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  ['items','logs','st'].forEach(k=>document.getElementById('view-'+k).classList.toggle('on', k===t));
  document.body.classList.toggle('st-open', t==='st');
  if(t==='logs') loadLogs(true);
  if(t==='st') loadStocktakeTab();
}
function renderCards(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = items.filter(i=> String(i.品名).toLowerCase().includes(q));
  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML = '<div class="empty">沒有符合的品項</div>'; return; }
  grid.innerHTML = '';
  list.forEach(it=> grid.appendChild(buildCard(it)));
}
function buildCard(it){
  const low = isLow(it);
  const div = document.createElement('div');
  div.className = 'card'+(low?' low':'');
  const src = imgSrc(it.圖片);
  div.innerHTML = `
    <div class="img">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:''}</div>
    <div class="body">
      <div class="name">${esc(it.品名)}</div>
      ${low?'<span class="lowtag">低庫存</span>':''}
      <div class="qtyrow"><span class="qty">${esc(it.數量)}</span><span class="unit">${esc(it.單位)}</span></div>
      <div class="note">${esc(it.備註)}</div>
      <div class="meta">更新：${esc(fmtTime(it.最後更新))}</div>
    </div>
    <div class="actions">
      <button class="edit">編輯</button>
      <button class="del">刪除</button>
    </div>`;
  const img = div.querySelector('img');
  if(img) img.onerror = ()=>{ img.style.display='none'; };
  div.querySelector('.edit').onclick = ()=>openItemModal(it);
  div.querySelector('.del').onclick = ()=>confirmDelete(it.ID, it.品名);
  return div;
}
function fillItemSelect(sel){
  sel.innerHTML = '<option value="">— 請選擇 —</option>' +
    items.map(i=>`<option value="${esc(i.ID)}">${esc(i.品名)}（${esc(i.數量)}${esc(i.單位)}）</option>`).join('');
}
function setPreviewImg(el, v){
  const src = imgSrc(v);
  el.style.visibility = src ? 'visible' : 'hidden';
  el.src = src;
}

/* ============ 調整數量 ============ */
async function quickAdjust(id, delta, note){
  const res = await apiPost({action:'adjustQty', id, delta, note});
  if(res.error){ showToast(res.error,'error'); return null; }
  if(!updateLocalItem(id, res.newQty)) await loadItems();   // 只更新這一項，不重新讀整份
  return res.newQty;
}

/* ============ 拿出贈品 ============ */
function openDispenseModal(){
  fillItemSelect(document.getElementById('dispenseSelect'));
  document.getElementById('dispensePreview').style.display='none';
  document.getElementById('dispenseQty').value = 1;
  document.getElementById('dispenseNote').value = '';
  showOverlay('dispenseOverlay');
}
function onDispenseSelect(){
  const id = document.getElementById('dispenseSelect').value;
  const it = items.find(i=>i.ID===id);
  const box = document.getElementById('dispensePreview');
  if(!it){ box.style.display='none'; return; }
  box.style.display='flex';
  setPreviewImg(document.getElementById('dpImg'), it.圖片);
  document.getElementById('dpStock').textContent = it.數量;
}
async function doDispense(){
  const id = document.getElementById('dispenseSelect').value;
  const it = items.find(i=>i.ID===id);
  if(!it){ showToast('請選擇品項','error'); return; }
  const qty = parseInt(document.getElementById('dispenseQty').value,10);
  if(!qty || qty<=0){ showToast('請輸入有效數量','error'); return; }
  if(qty > it.數量){ showToast('超過庫存數量！','error'); return; }
  const note = document.getElementById('dispenseNote').value;
  // 二次確認，避免手滑連續拿出
  if(!confirm(`確定拿出「${it.品名}」${qty}${it.單位}？\n拿出後剩 ${it.數量 - qty}${it.單位}`)) return;
  const btn = document.querySelector('#dispenseOverlay .save');
  btn.disabled = true; btn.textContent = '處理中…';
  const newQty = await quickAdjust(id, -qty, note);
  btn.disabled = false; btn.textContent = '確認拿出';
  if(newQty!==null){ showToast(`已拿出 ${qty}${it.單位}，剩 ${newQty}`,'success'); closeOverlay('dispenseOverlay'); }
}

/* ============ 補入庫存 ============ */
function openRestockModal(){
  fillItemSelect(document.getElementById('restockSelect'));
  document.getElementById('restockPreview').style.display='none';
  document.getElementById('restockQty').value = 1;
  document.getElementById('restockNote').value = '';
  showOverlay('restockOverlay');
}
function onRestockSelect(){
  const id = document.getElementById('restockSelect').value;
  const it = items.find(i=>i.ID===id);
  const box = document.getElementById('restockPreview');
  if(!it){ box.style.display='none'; return; }
  box.style.display='flex';
  setPreviewImg(document.getElementById('rsImg'), it.圖片);
  document.getElementById('rsStock').textContent = it.數量;
}
async function doRestock(){
  const id = document.getElementById('restockSelect').value;
  const it = items.find(i=>i.ID===id);
  if(!it){ showToast('請選擇品項','error'); return; }
  const qty = parseInt(document.getElementById('restockQty').value,10);

/** 讀取圖片並壓縮成最長邊 800px 的 JPEG */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, IMG_MAX_PX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('無法讀取這張圖片')); };
    img.src = url;
  });
}

/* ============ 異動記錄 ============ */
// 每次只向後端要 20 筆；篩選（品項、日期）也在後端做
let allLogs = [];
let logTotal = 0;
let logOffset = 0;   // 已向後端讀到的位置（與畫面上去重後的筆數分開計）
let logSeq = 0;
const LOG_PAGE = 20;
function logQuery(){
  const q = {};
  const itemId = document.getElementById('logFilterItem').value;
  const from = document.getElementById('logFilterFrom').value;
  const to = document.getElementById('logFilterTo').value;
  if(itemId) q.itemId = itemId;
  if(from) q.fromTs = new Date(from+'T00:00:00').toISOString();
  if(to) q.toTs = new Date(to+'T23:59:59.999').toISOString();
  return q;
}
function fillLogItemSelect(){
  const sel = document.getElementById('logFilterItem');
  const prev = sel.value;
  sel.innerHTML = '<option value="">全部品項</option>' +
    items.map(i=>`<option value="${esc(i.ID)}">${esc(i.品名)}</option>`).join('');
  sel.value = items.some(i=>i.ID===prev) ? prev : '';
}
/** reset=true：回到預設（全部品項、不限日期、最新 20 筆）；false：保留篩選重新讀第一頁 */
async function loadLogs(reset = true){
  if(reset) ['logFilterFrom','logFilterTo'].forEach(id=>{ document.getElementById(id).value = ''; });
  if(!items.length) await loadItems();
  fillLogItemSelect();
  if(reset) document.getElementById('logFilterItem').value = '';
  document.getElementById('logList').innerHTML = '<div class="empty">載入中…</div>';
  const seq = ++logSeq;
  const res = await apiPost({action:'getLogs', limit:LOG_PAGE, offset:0, ...logQuery()});
  if(seq !== logSeq) return;   // 使用者已換篩選，丟掉舊結果
  if(res.error){
    allLogs = []; logTotal = 0;
    const list = document.getElementById('logList');
    list.innerHTML = '<div class="empty"></div>';
    list.firstChild.textContent = res.error;
    return;
  }
  allLogs = res.logs || []; logTotal = res.total || allLogs.length; logOffset = allLogs.length;
  renderLogs();
}
async function loadMoreLogs(btn){
  btn.disabled = true; btn.textContent = '載入中…';
  const seq = logSeq;
  const res = await apiPost({action:'getLogs', limit:LOG_PAGE, offset:logOffset, ...logQuery()});
  if(seq !== logSeq) return;
  if(res.error){ showToast(res.error,'error'); btn.disabled = false; btn.textContent = '顯示更多'; return; }
  // 翻頁期間若有新記錄，位置會往後移一筆，用記錄ID去掉重複
  const seen = new Set(allLogs.map(l=>l.記錄ID));
  logOffset += (res.logs || []).length;
  allLogs = allLogs.concat((res.logs || []).filter(l=>!seen.has(l.記錄ID))); logTotal = res.total || logTotal;
  renderLogs();
}
function renderLogs(){
  const logs = allLogs;
  const list = document.getElementById('logList');
  if(!logs.length){ list.innerHTML = '<div class="empty">沒有符合的記錄</div>'; return; }
  list.innerHTML = logs.map((l, idx)=>{
    const it = items.find(i=>i.ID===String(l.品項ID));
    const src = it ? imgSrc(it.圖片) : '';
    const img = src ? `<img src="${esc(src)}" alt="" loading="lazy">` : '<img alt="" style="visibility:hidden">';
    const d = Number(l.變動量)||0;
    const plus = d>=0;
    const canRev = ['領用','補貨'].includes(l.類型) && !l.已沖銷;
    const revTag = l.已沖銷 ? ` · 已被 ${esc(l.已沖銷)} 沖銷` : '';
    return `<div class="logitem${l.已沖銷?' rev':''}">${img}
      <div class="linfo">
        <div class="lname"><span class="ltype">${esc(l.類型||'')}</span>${esc(l.品名)}</div>
        <div class="lnote">${esc(l.備註)||'—'}${l.操作者?' · '+esc(l.操作者):''}</div>
        <div class="ltime">${esc(fmtTime(l.時間))} · 後 ${esc(l.變動後數量)} · ${esc(l.記錄ID||'')}${revTag}</div>
      </div>
      <div class="ldelta ${plus?'plus':'minus'}">${plus?'+':''}${d}</div>
      ${canRev?`<button class="lrev" data-idx="${idx}">沖銷</button>`:''}
    </div>`;
  }).join('');
  list.insertAdjacentHTML('beforeend', `<div class="logmore">顯示 ${logs.length} / ${logTotal} 筆${
    logOffset < logTotal ? ` <button class="btn" id="logMoreBtn">顯示更多</button>` : ''}</div>`);
  const more = document.getElementById('logMoreBtn');
  if(more) more.onclick = ()=>loadMoreLogs(more);
  list.querySelectorAll('img').forEach(img=>{ img.onerror = ()=>{ img.style.visibility='hidden'; }; });
  list.querySelectorAll('.lrev').forEach(btn=>{
    btn.onclick = ()=>reverseEntry(logs[+btn.dataset.idx], btn);
  });
}
async function reverseEntry(l, btn){
  const d = Number(l.變動量)||0;
  const reason = prompt(`沖銷「${l.品名}」${d>0?'+':''}${d}？\n庫存會調回 ${-d>0?'+':''}${-d}，並新增一筆沖銷記錄（原記錄保留）。\n\n請輸入沖銷原因：`);
  if(reason===null) return;
  if(!reason.trim()){ showToast('請輸入沖銷原因','error'); return; }
  btn.disabled = true; btn.textContent = '…';
  const res = await apiPost({action:'reverseLog', logId:l.記錄ID, reason});
  if(res.error){ showToast(res.error,'error'); btn.disabled=false; btn.textContent='沖銷'; return; }
  showToast(`已沖銷，${l.品名} 現為 ${res.newQty}`,'success');
  updateLocalItem(String(l.品項ID), res.newQty);
  await loadLogs(false);
}
function clearLogFilter(){
  document.getElementById('logFilterItem').value = '';
  document.getElementById('logFilterFrom').value = '';

/* ============ 匯出 / 匯入 Excel ============ */
function todayStr(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
/** Excel 元件要用時才載入（平常開頁不下載） */
let xlsxPromise = null;
function loadXlsx(){
  if(typeof XLSX!=='undefined') return Promise.resolve(true);
  if(!xlsxPromise) xlsxPromise = new Promise(resolve=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    sc.onload = ()=>resolve(typeof XLSX!=='undefined');
    sc.onerror = ()=>{ xlsxPromise = null; resolve(false); };
    document.head.appendChild(sc);
  });
  return xlsxPromise;
}
async function xlsxReady(){
  if(await loadXlsx()) return true;
  showToast('Excel 元件載入失敗，請檢查網路後再試','error'); return false;
}
async function exportItems(){
  if(!await xlsxReady()) return;
  if(!items.length){ showToast('沒有資料可匯出','error'); return; }
  const rows = items.map(i=>({
    ID:i.ID, 品名:i.品名, 數量:i.數量, 單位:i.單位,
    低庫存警示:i.低庫存警示, 備註:i.備註, 最後更新:i.最後更新, 圖片:i.圖片
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '庫存');
  XLSX.writeFile(wb, `贈品庫存_${todayStr()}.xlsx`);
  showToast('已匯出庫存 Excel','success');
}
async function exportLogs(){
  if(!await xlsxReady()) return;
  showToast('匯出中…','success');
  const res = await apiPost({action:'getLogs', limit:5000, offset:0, ...logQuery()});
  if(res.error){ showToast(res.error,'error'); return; }
  const logs = res.logs || [];
  if(!logs.length){ showToast('沒有記錄可匯出','error'); return; }
  const ws = XLSX.utils.json_to_sheet(logs);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '異動記錄');
  XLSX.writeFile(wb, `異動記錄_${todayStr()}.xlsx`);
  if(res.total > logs.length) showToast(`記錄共 ${res.total} 筆，這次只匯出最新 ${logs.length} 筆；請用日期篩選分段匯出`,'error');
  else showToast('已匯出異動記錄 Excel','success');
}
async function importItems(e){
  const f = e.target.files[0];
  if(!f) return;
  e.target.value = '';   // 允許重選同檔
  if(!await xlsxReady()) return;
  if(f.size > IMPORT_MAX_BYTES){ showToast('檔案太大（上限 2MB）','error'); return; }
  try{
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    if(!rows.length){ showToast('檔案沒有資料','error'); return; }
    // 以「品名」為必填；有對應 ID 則更新，否則新增
    const valid = rows.filter(r=> String(r.品名||'').trim());
    if(!valid.length){ showToast('找不到「品名」欄','error'); return; }
    if(valid.length > IMPORT_MAX_ROWS){ showToast(`一次最多匯入 ${IMPORT_MAX_ROWS} 筆`,'error'); return; }
    if(!confirm(`將匯入 ${valid.length} 筆品項：\n・有對應 ID 的會更新品名、單位、警示、備註、圖片（數量不會變，數量請用拿出／補入／盤點調整）\n・沒有 ID 的會新增，並以「數量」欄當期初數量\n\n確定？`)) return;
    showToast(`匯入中…（0/${valid.length}）`,'success');
    let ok=0, fail=0;
    for(let i=0;i<valid.length;i++){
      const r = valid[i];
      const payload = {
        name:String(r.品名).trim(),
        qty:Number(r.數量)||0,
        unit:String(r.單位||'個').trim()||'個',
        minAlert:Number(r.低庫存警示)||0,
        note:String(r.備註||''),
        imgUrl:String(r.圖片||'')
      };
      const idStr = String(r.ID||'').trim();
      const exists = idStr && items.some(it=>it.ID===idStr);
      const res = exists
        ? await apiPost({action:'updateItem', id:idStr, ...payload})
        : await apiPost({action:'addItem', ...payload});
      if(res && res.error){ fail++; } else { ok++; }
    }
    await loadItems();
    showToast(`匯入完成：成功 ${ok}、失敗 ${fail}`, fail?'error':'success');
  }catch(err){ console.warn(err); showToast('匯入失敗，請確認檔案格式','error'); }
}

/* ============ 盤點 ============ */
const ST_INTERVAL_DAYS = 182;   // 盤點頻率：約半年一次
let st = { open:null, details:[], history:[], view:null, viewDetails:[], filter:'all' };
function stDetailMap(list){ const m={}; (list||[]).forEach(d=>m[String(d.品項ID)]=d); return m; }
async function loadStocktakeTab(){
  document.getElementById('stBody').innerHTML = '<div class="empty">載入中…</div>';
  document.getElementById('stFoot').innerHTML = '';

}
async function reloadStocktake(){

  if(res.error){ document.getElementById('stBody').innerHTML = ''; showToast(res.error,'error'); return; }
  st.open = res.open; st.details = res.details||[]; st.history = res.history||[]; st.view = null;

function stDiffHtml(d){
  if(d==null || d==='') return '<div class="sdiff zero">—</div>';
  const n = Number(d);
  return `<div class="sdiff ${n>0?'plus':n<0?'minus':'zero'}">${n>0?'+':''}${n}</div>`;
}
function renderStocktake(){
  const body = document.getElementById('stBody'), foot = document.getElementById('stFoot');
  const title = document.getElementById('stTitle');
  document.getElementById('stPrintBtn').style.display = st.open ? '' : 'none';
  document.getElementById('stExportBtn').style.display = st.view ? '' : 'none';

  if(st.view){ // 歷史明細
    const v = st.view;
    title.textContent = `盤點 ${v.盤點ID}（${v.狀態}）`;
    const rows = st.viewDetails.map(d=>`<div class="strow ${Number(d.差異)?'diff':'done'}">
      <div class="sinfo"><div class="sname">${esc(d.品名)}</div>
      <div class="sbook">帳面 ${esc(d.帳面數量)} → 實點 ${esc(d.實點數量)}${d.備註?' · '+esc(d.備註):''} · ${esc(d.輸入者)}</div></div>
      ${stDiffHtml(d.差異)}</div>`).join('');
    body.innerHTML = `<div class="stbar">
      <div class="stat"><span class="label">開始</span><span class="value">${esc(fmtTime(v.開始時間))}</span></div>
      <div class="stat"><span class="label">完成</span><span class="value">${esc(fmtTime(v.完成時間))||'—'}</span></div>
      <div class="stat"><span class="label">已盤</span><span class="value">${esc(v.已盤)}</span></div>
      <div class="stat low"><span class="label">有差異</span><span class="value">${esc(v.有差異)}</span></div>
      <div class="stat"><span class="label">調整合計</span><span class="value">${esc(v.調整合計)}</span></div></div>
      ${v.備註?`<p style="margin-bottom:10px;color:var(--mid)">${esc(v.備註)}</p>`:''}
      ${rows || '<div class="empty">沒有輸入任何實點</div>'}`;
    foot.innerHTML = '<button class="cancel">返回</button>';
    foot.firstChild.onclick = ()=>{ st.view=null; renderStocktake(); };
    return;
  }

  if(!st.open){ // 沒有進行中：開始 + 歷史
    title.textContent = '盤點';
    const hist = st.history.map((h,i)=>`<div class="sthist">
      <div class="hinfo"><div class="htitle">${esc(h.盤點ID)} <span class="tag ${h.狀態==='已取消'?'cancel':''}">${esc(h.狀態)}</span></div>
      <div class="hsub">${esc(fmtTime(h.開始時間))} · ${esc(h.開始者)} · 已盤 ${esc(h.已盤)} · 差異 ${esc(h.有差異)} 項 · 調整 ${esc(h.調整合計)}${h.備註?' · '+esc(h.備註):''}</div></div>
      <button class="hbtn" data-i="${i}">查看</button></div>`).join('');
    const lastDone = st.history.find(h=>h.狀態==='已完成');
    const lt = lastDone ? new Date(lastDone.完成時間 || lastDone.開始時間) : null;
    const days = lt && !isNaN(lt) ? Math.floor((Date.now() - lt) / 86400000) : null;
    const due = days === null || days >= ST_INTERVAL_DAYS;
    const remind = `<div class="stremind${due?' due':''}">${days === null
      ? '還沒有完成過盤點。建議每半年盤點一次。'
      : `上次完成盤點：${lt.getFullYear()}/${lt.getMonth()+1}/${lt.getDate()}（${days} 天前）。${due ? '已超過半年，建議安排盤點。' : '建議每半年盤點一次。'}`}</div>`;
    body.innerHTML = remind + `<p class="stintro">
      開始後逐項輸入實際點到的數量，系統會自動算出差異。盤點期間照常可以拿出、補入。<br>
      按「完成盤點」才會一次調整庫存；完成前隨時可以修改或取消。</p>
      <h4 style="margin:6px 0 12px;font-size:16px">過去的盤點</h4>${hist || '<div class="empty" style="padding:20px">還沒有盤點記錄</div>'}`;
    body.querySelectorAll('.sthist button').forEach(b=> b.onclick = ()=>viewStocktake(st.history[+b.dataset.i]));
    foot.innerHTML = '<button class="save">＋ 開始盤點</button>';
    foot.firstChild.onclick = startStocktake;
    return;
  }

  // 進行中
  const o = st.open, map = stDetailMap(st.details);
  title.textContent = `盤點 ${o.盤點ID} 進行中`;
  const counted = items.filter(i=>map[i.ID]).length;
  const diffs = items.filter(i=>map[i.ID] && Number(map[i.ID].差異)!==0).length;
  const list = items.filter(i=> st.filter==='all' || (st.filter==='todo' && !map[i.ID]) || (st.filter==='diff' && map[i.ID] && Number(map[i.ID].差異)!==0));
  body.innerHTML = `<div class="stbar">
      <div class="stat"><span class="label">進度</span><span class="value">${counted} / ${items.length}</span></div>
      <div class="stat low"><span class="label">有差異</span><span class="value">${diffs}</span></div>
      <div class="stat"><span class="label">開始</span><span class="value">${esc(fmtTime(o.開始時間))}</span></div></div>
    <div class="stfilter">
      <button data-f="all" class="${st.filter==='all'?'on':''}">全部</button>
      <button data-f="todo" class="${st.filter==='todo'?'on':''}">未盤 ${items.length-counted}</button>
      <button data-f="diff" class="${st.filter==='diff'?'on':''}">有差異 ${diffs}</button></div>
    <div>${list.map(it=>{
      const d = map[it.ID]; const src = imgSrc(it.圖片);
      const cls = d ? (Number(d.差異)?'diff':'done') : '';
      return `<div class="strow ${cls}" data-id="${esc(it.ID)}">
        ${src?`<img src="${esc(src)}" alt="" loading="lazy">`:'<img alt="" style="visibility:hidden">'}
        <div class="sinfo"><div class="sname">${esc(it.品名)}</div>
        <div class="sbook">帳面 <b>${esc(it.數量)}</b> ${esc(it.單位)}${d?` · 輸入時帳面 ${esc(d.帳面數量)}`:''}</div></div>
        <input type="number" inputmode="numeric" min="0" placeholder="實點" value="${d?esc(d.實點數量):''}">
        ${stDiffHtml(d?d.差異:null)}
        <div class="sstate">${d?'✓':''}</div></div>`;
    }).join('') || '<div class="empty">沒有符合的品項</div>'}</div>`;
  body.querySelectorAll('.stfilter button').forEach(b=> b.onclick = ()=>{ st.filter=b.dataset.f; renderStocktake(); });
  body.querySelectorAll('.strow img').forEach(img=>{ img.onerror=()=>{ img.style.visibility='hidden'; }; });
  body.querySelectorAll('.strow input').forEach(inp=>{
    inp.onchange = ()=>saveCount(inp.closest('.strow').dataset.id, inp);
    inp.onkeydown = e=>{ if(e.key==='Enter'){ inp.blur(); const rows=[...body.querySelectorAll('.strow input')]; const n=rows[rows.indexOf(inp)+1]; if(n) n.focus(); } };
  });
  foot.innerHTML = '<button class="cancel">取消盤點</button><button class="save">完成盤點</button>';
  foot.children[0].onclick = cancelStocktake;
  foot.children[1].onclick = finalizeStocktake;
}
async function startStocktake(){
  const note = prompt('開始新的盤點。\n備註（選填，例如「2026 Q3 盤點」）：', '');
  if(note===null) return;
  const res = await apiPost({action:'startStocktake', note});
  if(res.error){ showToast(res.error,'error'); return; }
  showToast(`已建立盤點單 ${res.stId}`,'success');
  st.filter = 'all';
  await reloadStocktake();
}
/** 清空輸入框＝把這項改回「未盤」 */
async function clearCount(itemId, inp){
  if(!st.details.some(d=>String(d.品項ID)===itemId)) return;
  const row = inp.closest('.strow'); const state = row.querySelector('.sstate');
  state.textContent = '…';
  const res = await apiPost({action:'clearCount', stId:st.open.盤點ID, itemId});
  if(res.error){ state.textContent = '!'; showToast(res.error,'error'); return; }
  st.details = st.details.filter(d=>String(d.品項ID)!==itemId);
  renderStocktake();
  showToast('已清除這項的實點數量','success');
}
async function saveCount(itemId, inp){
  const v = inp.value.trim();
  if(v===''){ return clearCount(itemId, inp); }
  const n = Number(v);
  if(!Number.isInteger(n) || n<0){ showToast('實點數量需為 0 以上的整數','error'); return; }
  const row = inp.closest('.strow'); const state = row.querySelector('.sstate');
  state.textContent = '…';
  const res = await apiPost({action:'saveCount', stId:st.open.盤點ID, itemId, counted:n});
  if(res.error){ state.textContent = '!'; showToast(res.error,'error'); return; }
  const it = items.find(i=>i.ID===itemId);
  st.details = st.details.filter(d=>String(d.品項ID)!==itemId);
  st.details.push({品項ID:itemId, 品名:it?it.品名:'', 帳面數量:res.book, 實點數量:res.counted, 差異:res.diff});
  // 只更新這一列與統計，避免打斷連續輸入
  row.className = 'strow ' + (res.diff ? 'diff' : 'done');
  row.querySelector('.sdiff').outerHTML = stDiffHtml(res.diff);
  state.textContent = '✓';
  const map = stDetailMap(st.details);
  const counted = items.filter(i=>map[i.ID]).length, diffs = items.filter(i=>map[i.ID] && Number(map[i.ID].差異)!==0).length;
  const vals = document.querySelectorAll('#stBody .stbar .value');
  if(vals[0]) vals[0].textContent = `${counted} / ${items.length}`;
  if(vals[1]) vals[1].textContent = diffs;
  const fb = document.querySelectorAll('#stBody .stfilter button');
  if(fb[1]) fb[1].textContent = `未盤 ${items.length-counted}`;
  if(fb[2]) fb[2].textContent = `有差異 ${diffs}`;
}
async function finalizeStocktake(){
  const map = stDetailMap(st.details);
  const counted = items.filter(i=>map[i.ID]);
  if(!counted.length){ showToast('還沒有輸入任何實點數量','error'); return; }
  const diffs = counted.filter(i=>Number(map[i.ID].差異)!==0);
  const lines = diffs.slice(0,12).map(i=>`・${i.品名}：${Number(map[i.ID].差異)>0?'+':''}${map[i.ID].差異}`).join('\n');
  const todo = items.length - counted.length;
  const msg = `完成盤點 ${st.open.盤點ID}？\n\n已盤 ${counted.length} 項${todo?`（還有 ${todo} 項未盤，不會調整）`:''}\n`
    + (diffs.length ? `將調整 ${diffs.length} 項：\n${lines}${diffs.length>12?'\n…':''}` : '全部相符，不需調整。')
    + '\n\n完成後無法修改。';
  if(!confirm(msg)) return;
  const btn = document.querySelector('#stFoot .save'); btn.disabled = true; btn.textContent = '處理中…';
  const res = await apiPost({action:'finalizeStocktake', stId:st.open.盤點ID});
  btn.disabled = false; btn.textContent = '完成盤點';
  if(res.error){ showToast(res.error,'error'); return; }
  showToast(`盤點完成，調整 ${res.adjusted} 項`,'success');
  await loadItems();
  await reloadStocktake();
}
async function cancelStocktake(){
  if(!confirm(`取消盤點 ${st.open.盤點ID}？\n已輸入的實點數量會保留在記錄中，但不會調整庫存。`)) return;
  const res = await apiPost({action:'cancelStocktake', stId:st.open.盤點ID});
  if(res.error){ showToast(res.error,'error'); return; }
  showToast('已取消盤點','success');
  await reloadStocktake();
}
async function viewStocktake(h){
  const res = await apiPost({action:'getStocktakeDetail', stId:h.盤點ID});
  if(res.error){ showToast(res.error,'error'); return; }
  st.view = res.stocktake; st.viewDetails = res.details||[];
  renderStocktake();
}
function printStocktake(){
  if(!st.open) return;
  const map = stDetailMap(st.details);
  const d = new Date();
  const area = document.getElementById('printArea');
  area.innerHTML = `<h2>贈品盤點表　${esc(st.open.盤點ID)}</h2>
    <p>列印時間：${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}　${st.open.備註?'備註：'+esc(st.open.備註):''}</p>
    <table><thead><tr><th>#</th><th>品名</th><th>單位</th><th>帳面</th><th>實點</th><th>備註</th></tr></thead>
    <tbody>${items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.品名)}</td><td>${esc(it.單位)}</td>
      <td class="num">${esc(it.數量)}</td><td class="blank">${map[it.ID]?esc(map[it.ID].實點數量):''}</td><td></td></tr>`).join('')}</tbody></table>
    <div class="sign"><span>盤點人：＿＿＿＿＿＿</span><span>覆核：＿＿＿＿＿＿</span><span>日期：＿＿＿＿＿＿</span></div>`;
  window.print();
}
async function exportStocktake(){
  if(!st.view || !await xlsxReady()) return;
  const rows = st.viewDetails.map(d=>({ 品項ID:d.品項ID, 品名:d.品名, 帳面數量:d.帳面數量, 實點數量:d.實點數量, 差異:d.差異, 備註:d.備註, 輸入者:d.輸入者, 輸入時間:d.輸入時間, 調整記錄ID:d.調整記錄ID }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{說明:'沒有明細'}]), '盤點明細');
  XLSX.writeFile(wb, `盤點_${st.view.盤點ID}_${todayStr()}.xlsx`);
  showToast('已匯出盤點明細','success');
}

/* ============ 人員管理 ============ */
let people = { list:[], me:'', passwordMode:false };
async function openPeople(){
  document.getElementById('peopleList').innerHTML = '<div class="empty" style="padding:20px">載入中…</div>';
  document.getElementById('newPersonName').value = '';
  document.getElementById('newPersonManage').checked = false;
  showOverlay('peopleOverlay');
  await reloadPeople();
}
async function reloadPeople(){
  const res = await apiPost({action:'listAdmins'});
  if(res.error){ closeOverlay('peopleOverlay'); if(res.code!=='AUTH') showToast(res.error,'error'); return; }
  people = { list: res.people||[], me: res.me, passwordMode: !!res.passwordMode };
  renderPeople();
}
function renderPeople(){
  const box = document.getElementById('peopleList');
  box.innerHTML = people.list.map((p,i)=>{
    const me = p.name===people.me;
    const status = !people.passwordMode ? '' : (p.pendingInit ? '等待首次登入（已有初始碼）' : (p.hasPassword ? '已設密碼' : '尚未設密碼'));
    return `<div class="prow${p.enabled?'':' off'}" data-i="${i}">
      <div class="pname"><input type="text" maxlength="20" value="${esc(p.name)}">
        <div class="pmeta">${me?'<span class="me">目前登入</span> ':''}最後登入：${esc(fmtTime(p.lastLogin))||'—'}${status?' · '+esc(status):''}</div></div>
      <label class="chk"><input type="checkbox" class="pen" ${p.enabled?'checked':''} ${me?'disabled':''}> 啟用</label>
      <label class="chk"><input type="checkbox" class="pmg" ${p.canManage?'checked':''} ${me?'disabled':''}> 可管理</label>
      <div class="pbtns">
        ${people.passwordMode?'<button class="preset">重設密碼</button>':''}
        <button class="save psave">儲存</button>
      </div></div>`;
  }).join('') || '<div class="empty" style="padding:20px">沒有人員</div>';
  box.querySelectorAll('.prow').forEach(row=>{
    const p = people.list[+row.dataset.i];
    row.querySelector('.psave').onclick = ()=>savePerson(p, row);
    const rs = row.querySelector('.preset'); if(rs) rs.onclick = ()=>resetPerson(p);
  });
}
function showInitCode(name, code){
  alert(`「${name}」的一次性初始碼：\n\n${code}\n\n請私下交給對方。第一次登入時需用它設定自己的密碼，之後初始碼就失效。\n（這個代碼只會顯示這一次）`);
}
async function savePerson(p, row){
  const name = row.querySelector('.pname input').value.trim();
  const enabled = row.querySelector('.pen').checked;
  const manage = row.querySelector('.pmg').checked;
  if(!name){ showToast('請填寫名稱','error'); return; }
  if(!enabled && p.enabled && !confirm(`停用「${p.name}」？\n停用後對方會立即登出、無法再登入。`)) return;
  const btn = row.querySelector('.psave'); btn.disabled = true; btn.textContent = '…';
  const res = await apiPost({action:'saveAdmin', origName:p.name, name, enabled, canManage:manage, note:p.note});
  btn.disabled = false; btn.textContent = '儲存';
  if(res.error){ showToast(res.error,'error'); return; }
  if(res.token){ setSession(res.token, res.name); }
  showToast('已儲存','success');
  await reloadPeople();
}
async function addPerson(){
  const name = document.getElementById('newPersonName').value.trim();
  const manage = document.getElementById('newPersonManage').checked;
  if(!name){ showToast('請輸入新人員名稱','error'); return; }
  const res = await apiPost({action:'saveAdmin', name, enabled:true, canManage:manage, note:''});
  if(res.error){ showToast(res.error,'error'); return; }
  document.getElementById('newPersonName').value = '';
  document.getElementById('newPersonManage').checked = false;
  showToast(`已新增「${name}」`,'success');
  if(res.initCode) showInitCode(name, res.initCode);
  await reloadPeople();
}
async function resetPerson(p){
  const self = p.name === people.me;
  if(!confirm(`重設「${p.name}」的密碼？\n舊密碼會失效，對方目前的登入會立即登出，並產生新的一次性初始碼。${self?'\n\n這是你自己的帳號：重設後你也會被登出，需用新的初始碼重新登入。':''}`)) return;
  const res = await apiPost({action:'resetAdminPasscode', name:p.name});
  if(res.error){ showToast(res.error,'error'); return; }
  showInitCode(p.name, res.initCode);
  await reloadPeople();
}

/* ============ 登入 / 密碼 ============ */
function showLogin(msg){
  document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));
  switchTab('items');
  document.getElementById('loginPass').value = '';
  document.getElementById('loginPassField').style.display = needPass ? '' : 'none';
  if(userName) document.getElementById('loginName').value = userName;
  showOverlay('loginOverlay');
  if(msg) showToast(msg,'error');
  setTimeout(()=>document.getElementById(needPass && document.getElementById('loginName').value?'loginPass':'loginName').focus(), 50);
}
async function doLogin(){
  const name = document.getElementById('loginName').value.trim();
  const passcode = document.getElementById('loginPass').value;
  if(!name || (needPass && !passcode)){ showToast(needPass ? '請輸入名稱與密碼' : '請輸入名稱','error'); return; }
  const btn = document.querySelector('#loginOverlay .save');
  btn.disabled = true; btn.textContent = '登入中…';
  const res = await apiPost({action:'login', name, passcode});
  btn.disabled = false; btn.textContent = '登入';
  document.getElementById('loginPass').value = '';
  if(res.error){ showToast(res.error,'error'); return; }
  setSession(res.token, res.name);
  closeOverlay('loginOverlay');
  if(res.mustChange){ openChangePass(true); return; }
  showToast(`歡迎，${res.name}`,'success');
  loadItems();
}
let passForced = false;
function openChangePass(forced){
  passForced = forced;
  document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));
  document.getElementById('passHint').textContent = forced ? '第一次登入，請設定你自己的密碼（初始碼將失效）。' : '';
  document.getElementById('curPassField').style.display = forced ? 'none' : 'block';
  document.getElementById('passCancel').style.display = forced ? 'none' : 'block';
  ['curPass','newPass','newPass2'].forEach(id=>document.getElementById(id).value='');
  showOverlay('passOverlay');
}
async function doChangePass(){
  const passcode = document.getElementById('curPass').value;
  const newPasscode = document.getElementById('newPass').value;
  if(newPasscode.length < 6){ showToast('新密碼至少 6 字','error'); return; }
  if(newPasscode !== document.getElementById('newPass2').value){ showToast('兩次輸入的新密碼不一樣','error'); return; }
  const res = await apiPost({action:'changePasscode', passcode, newPasscode});
  ['curPass','newPass','newPass2'].forEach(id=>document.getElementById(id).value='');
  if(res.error){ if(res.code!=='AUTH') showToast(res.error,'error'); return; }
  setSession(res.token, res.name);
  closeOverlay('passOverlay');
  showToast('密碼已更新','success');
  if(passForced) loadItems();
}
function openAccount(){
  document.getElementById('accountHint').textContent = openMode
    ? `目前為免登入模式，操作者記為「${userName}」` : (userName ? `目前登入：${userName}` : '');
  const show = (id, on) => { document.getElementById(id).style.display = on ? '' : 'none'; };
  show('accPeople', !openMode && canManage);
  show('accPass', !openMode && needPass);
  show('accApi', !openMode && canManage);   // 後端網址只給可管理人員
  // 備份狀態（只給可管理人員看）：超過 8 天沒備份就提醒
  const bk = document.getElementById('accBackup');
  const bt = new Date(lastBackup);
  const stale = !lastBackup || isNaN(bt) || (Date.now() - bt) > 8 * 86400000;
  bk.textContent = !lastBackup || isNaN(bt) ? '⚠ 尚未設定每週自動備份'
    : `最後自動備份：${bt.getFullYear()}/${bt.getMonth()+1}/${bt.getDate()}${stale ? '（已超過一週，請檢查備份）' : ''}`;
  bk.style.color = stale ? 'var(--danger, #c0392b)' : '';
  show('accBackup', !openMode && canManage);
  document.querySelector('#accountOverlay .mbtns .save').style.display = openMode ? 'none' : '';
  showOverlay('accountOverlay');
}
async function doLogout(){
  closeOverlay('accountOverlay');
  await apiPost({action:'logout'});
  setSession('','');
  lsSet(ITEMS_CACHE, null);
  items = []; renderStats();
  document.getElementById('grid').innerHTML = '';
  showLogin();
}

/* ============ Toast / Overlay ============ */
let toastTimer;
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show '+(type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className='toast '+(type||''), 2600);
}
function showOverlay(id){ document.getElementById(id).classList.add('show'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click', e=>{
    if(e.target!==o) return;
    if(o.id==='loginOverlay' || (o.id==='passOverlay' && passForced)) return;
    o.classList.remove('show');
  });
});

/* ============ 啟動 ============ */
setSession(token, userName);
showCachedItems();   // 先顯示上次的庫存，背景同步
loadItems();   // 需要登入時，後端回 AUTH 會自動顯示登入框
</script>
